name: Frontend React CI

on:
  pull_request:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [codex-ci-recovery]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  frontend-checks:
    name: Frontend React ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: contratti
            command: pnpm --filter @iusentra/studio test
          - label: typecheck
            command: pnpm --filter @iusentra/studio typecheck
          - label: build
            command: pnpm --filter @iusentra/studio build:vite
    steps:
      - uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  frontend:
    name: Frontend React CI
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check frontend shards
        run: |
          if [ "${{ needs['frontend-checks'].result }}" != "success" ]; then
            echo "Uno o piu' shard frontend non sono verdi."
            exit 1
          fi
          echo "Tutti gli shard frontend sono verdi."
