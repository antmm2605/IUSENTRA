        minimum: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    SearchParam:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    StatusParam:
      name: status
      in: query
      schema:
        type: string
        maxLength: 40
