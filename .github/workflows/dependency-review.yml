name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dipendenze in ingresso
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dependency review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Dependency review non disponibile
        if: ${{ steps.dependency-review.outcome == 'failure' }}
        run: |
          echo "::warning::Dependency Review non è disponibile per questo repository finché GitHub Dependency Graph non è attivo. Restano attivi pip-audit, pnpm audit e SBOM nel workflow Security Supply Chain."
