name: Pubblicazione selettiva Codici e leggi
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verifica oppure pubblica la sola pagina
        type: choice
        options: [inspect, publish]
        default: inspect
permissions:
  # GitHub requires repository write access to read private draft release assets.
  contents: write
concurrency:
  group: deploy-hetzner-production
  cancel-in-progress: false
env:
  HETZNER_HOST: ${{ vars.HETZNER_HOST || '116.203.45.57' }}
  HETZNER_USER: ${{ vars.HETZNER_USER || 'root' }}
  RELEASE_TAG: codici-leggi-only-20261011
jobs:
  codici:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Recupera pacchetto selettivo verificato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir package
          asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/409497386" --jq '.assets[] | select(.name == "codici-package.tar.gz") | .id')
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" > package/codici-package.tar.gz
          printf '%s  %s\n' 'bccb0565feedbac0157b0a74684b0071b36f0b20b2b5622d1f2ec7c8825fe21a' package/codici-package.tar.gz | sha256sum -c -
          tar -xzf package/codici-package.tar.gz -C package
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('package');m=json.loads((p/'INSTALL_MANIFEST.json').read_text())
          assert hashlib.file_digest((p/'codici_leggi.sqlite').open('rb'),'sha256').hexdigest()==m['database_sha256']
          for e in m['files']:
              assert hashlib.file_digest((p/'sources'/e['path']).open('rb'),'sha256').hexdigest()==e['after']
          print('Impronte del pacchetto verificate')
          PY
      - uses: actions/setup-node@v5
        if: inputs.operation == 'publish'
        with:
          node-version: '24'
      - name: Compila sulla versione attuale del server
        if: inputs.operation == 'publish'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.1.2 --activate
          pnpm install --frozen-lockfile --prod=false
          cd frontend
          node --import ../tests/js/support/resolve_ts_extensionless.mjs --test ../tests/js/codici_leggi_results.test.mjs ../tests/js/codici_leggi_search.test.mjs
          pnpm typecheck
          pnpm build:vite
          cd ..
          cp -a web/static/react package/react
      - name: Accesso temporaneo e verifica server
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_codici
          chmod 600 ~/.ssh/id_codici
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'shred -u ~/.ssh/id_codici' EXIT
          target="${HETZNER_USER}@${HETZNER_HOST}"
          remote="/tmp/iusentra-codici-${GITHUB_RUN_ID}"
          args=(-i "$HOME/.ssh/id_codici" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${args[@]}" "$target" "mkdir -m 700 '$remote'"
          tar -czf codici-install.tar.gz -C package INSTALL_MANIFEST.json sources codici_leggi.sqlite $(test "$OPERATION" != publish || echo react)
          scp "${args[@]}" codici-install.tar.gz tools/deploy_codici_only.py "$target:$remote/"
          ssh "${args[@]}" "$target" "set -eu; trap 'rm -rf $remote' EXIT; tar -xzf '$remote/codici-install.tar.gz' -C '$remote'; python3 '$remote/deploy_codici_only.py' '$OPERATION' '$remote'"
      - name: Verifica HTTPS pubblica
        if: inputs.operation == 'publish'
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 --max-time 30 https://app.iusentra.it/api/pronto
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://app.iusentra.it/ricerca-legale/codici)
          test "$code" = 200 -o "$code" = 302
          echo 'HTTPS della pagina raggiungibile; resta la verifica autenticata del contenuto.'
