<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link scaduto — {{ studio_nome }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .pay-card { max-width: 420px; width: 100%; border-radius: 1.25rem; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
    .err-header { background: linear-gradient(135deg, #64748b 0%, #94a3b8 100%); color: #fff; border-radius: 1.25rem 1.25rem 0 0; padding: 2rem; text-align: center; }
    .icon-circle { width: 5rem; height: 5rem; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2.5rem; }
  </style>
</head>
<body>
  <div class="pay-card card border-0">
    <div class="err-header">
      <div class="icon-circle"><i class="bi bi-clock-history"></i></div>
      <h2 class="h4 mb-1">Link scaduto</h2>
    </div>
    <div class="card-body p-4 text-center">
      <p class="text-muted mb-4">
        Questo link di pagamento non è più valido o è scaduto.<br>
        Contatta lo studio per richiederne uno nuovo.
      </p>
      <div class="text-muted">
        <i class="bi bi-building me-1"></i><strong>{{ studio_nome }}</strong>
      </div>
    </div>
  </div>
</body>
</html>
