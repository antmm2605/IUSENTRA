{% extends "base.html" %}
{% block title %}Lex AI — Assistente Legale{% endblock %}
{% block page_title %}Lex AI{% endblock %}

{% block content %}
<style>
/* ── LEX SHELL ── */
#lex-shell {
  display: flex;
  flex-direction: column;
  height: calc(100vh - var(--topbar-h, 50px));
  background: #f0f4f8;
  overflow: hidden;
  position: relative;
}

/* ── TOPBAR ── */
#lex-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1rem;
  height: 58px;
  background: #0f172a;
  flex-shrink: 0;
  gap: .75rem;
}
.lex-brand {
  display: flex;
  align-items: center;
  gap: .6rem;
  min-width: 0;
}
.lex-logo-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.lex-logo-circle i { font-size: 1.15rem; color: #0f172a; }
.lex-brand-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.lex-name {
  font-size: .95rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: .01em;
}
.lex-badges {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
}
.lex-badge {
  font-size: .68rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: .02em;
}
.lex-badge-companion {
  background: rgba(239,68,68,.18);
  color: #fca5a5;
  border: 1px solid rgba(239,68,68,.3);
}
.lex-badge-companion.online {
  background: rgba(34,197,94,.15);
  color: #86efac;
  border-color: rgba(34,197,94,.3);
}
.lex-badge-voice {
  background: rgba(34,197,94,.15);
  color: #86efac;
  border: 1px solid rgba(34,197,94,.3);
}
.lex-badge-voice.inactive {
  background: rgba(100,116,139,.15);
  color: #94a3b8;
  border-color: rgba(100,116,139,.2);
}
.lex-topbar-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}
.lex-icon-btn {
  width: 34px;
  height: 34px;
  border: none;
  background: transparent;
  color: #94a3b8;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s, color .15s;
  font-size: .9rem;
  text-decoration: none;
}
.lex-icon-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
.lex-icon-btn.active { background: rgba(255,255,255,.15); color: #fff; }

/* ── MESSAGES AREA ── */
#lex-messages {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 1.5rem 1.25rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ── GREETING STATE ── */
#lex-greeting {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: .75rem;
  padding-top: .5rem;
}
.lex-avatar-row {
  display: flex;
  align-items: center;
  gap: .75rem;
}
.lex-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #0f172a;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.lex-avatar i { font-size: 1.1rem; color: #fff; }
.lex-greeting-bubble {
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 0 12px 12px 12px;
  padding: .65rem 1rem;
  font-size: .93rem;
  font-weight: 500;
  color: #1e293b;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}

/* ── MESSAGE BUBBLES ── */
.lex-msg {
  display: flex;
  gap: .65rem;
  max-width: 90%;
}
.lex-msg.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}
.lex-msg.assistant { align-self: flex-start; }
.lex-msg-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: .75rem;
  margin-top: 2px;
}
.lex-msg.assistant .lex-msg-avatar {
  background: #0f172a;
  color: #fff;
}
.lex-msg.user .lex-msg-avatar {
  background: #1a2744;
  color: #fff;
}
.lex-msg-body { min-width: 0; }
.lex-bubble {
  padding: .65rem .9rem;
  border-radius: 4px 12px 12px 12px;
  font-size: .875rem;
  line-height: 1.6;
  color: #1e293b;
  background: #fff;
  border: 1px solid #e2e8f0;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  word-break: break-word;
}
.lex-msg.user .lex-bubble {
  border-radius: 12px 4px 12px 12px;
  background: #1a2744;
  color: #fff;
  border-color: transparent;
}
/* Markdown styling inside bubbles */
.lex-bubble h1,.lex-bubble h2,.lex-bubble h3 {
  font-size: .95rem; font-weight: 700; margin: .75rem 0 .3rem;
  color: inherit;
}
.lex-bubble ul,.lex-bubble ol { padding-left: 1.25rem; margin: .4rem 0; }
.lex-bubble li { margin-bottom: .2rem; }
.lex-bubble p { margin: 0 0 .5rem; }
.lex-bubble p:last-child { margin-bottom: 0; }
.lex-bubble code {
  font-size: .82rem;
  background: rgba(0,0,0,.06);
  padding: 1px 4px;
  border-radius: 3px;
  font-family: monospace;
}
.lex-msg.user .lex-bubble code { background: rgba(255,255,255,.15); }
.lex-bubble pre {
  background: rgba(0,0,0,.05);
  padding: .5rem .75rem;
  border-radius: 6px;
  overflow-x: auto;
  font-size: .8rem;
  margin: .5rem 0;
}
.lex-bubble strong { font-weight: 700; }
.lex-bubble hr {
  border: none;
  border-top: 1px solid rgba(0,0,0,.1);
  margin: .5rem 0;
}

/* Actions below assistant bubble */
.lex-msg-actions {
  display: flex;
  gap: .35rem;
  margin-top: .4rem;
  flex-wrap: wrap;
}
.lex-msg-action {
  font-size: .72rem;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid #e2e8f0;
  background: #fff;
  color: #64748b;
  cursor: pointer;
  transition: background .12s, color .12s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.lex-msg-action:hover { background: #f1f5f9; color: #0f172a; }

/* Typing indicator */
.lex-typing-dots {
  display: flex;
  gap: 4px;
  padding: .5rem .25rem;
  align-items: center;
}
.lex-typing-dots span {
  width: 6px; height: 6px;
  background: #94a3b8;
  border-radius: 50%;
  animation: lexdot 1.2s infinite ease-in-out;
}
.lex-typing-dots span:nth-child(2) { animation-delay: .2s; }
.lex-typing-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes lexdot {
  0%,80%,100% { transform: scale(.6); opacity: .4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── BOTTOM PANEL ── */
#lex-bottom {
  background: #fff;
  border-top: 1px solid #e2e8f0;
  padding: .75rem 1rem 1rem;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: .6rem;
}

/* Mode chips */
#lex-modes {
  display: flex;
  gap: .45rem;
  flex-wrap: wrap;
}
.lex-mode-chip {
  font-size: .78rem;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1.5px solid #cbd5e1;
  background: transparent;
  color: #475569;
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .01em;
}
.lex-mode-chip:hover { border-color: #0f172a; color: #0f172a; }
.lex-mode-chip.active {
  border-color: #0f172a;
  background: #0f172a;
  color: #fff;
}

/* Quick starters */
#lex-starters {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
}
.lex-starter {
  font-size: .74rem;
  padding: 4px 11px;
  border-radius: 20px;
  border: 1px solid #e2e8f0;
  background: #f8f9fb;
  color: #475569;
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.lex-starter:hover { background: #f1f5f9; border-color: #c8d0dc; color: #1e293b; }

/* Action row: carica + detta */
.lex-upload-row {
  display: flex;
  gap: .65rem;
}
.lex-upload-btn, .lex-voice-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  padding: .55rem;
  border-radius: 10px;
  border: 1.5px solid #e2e8f0;
  background: #f8f9fb;
  color: #1a2744;
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.lex-upload-btn:hover, .lex-voice-btn:hover { background: #f1f5f9; border-color: #c8d0dc; }
.lex-voice-btn.recording {
  background: rgba(239,68,68,.07);
  border-color: #ef4444;
  color: #ef4444;
  animation: pulse-record .9s ease-in-out infinite alternate;
}
@keyframes pulse-record { from { opacity: 1; } to { opacity: .7; } }

/* Attachments */
#lex-attachments {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
}
.lex-att-chip {
  display: flex;
  align-items: center;
  gap: .3rem;
  font-size: .76rem;
  padding: 3px 10px 3px 8px;
  border-radius: 20px;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  color: #475569;
}
.lex-att-chip button {
  border: none;
  background: none;
  color: #94a3b8;
  cursor: pointer;
  font-size: .8rem;
  line-height: 1;
  padding: 0;
  margin-left: 2px;
}
.lex-att-chip button:hover { color: #ef4444; }

/* Input row */
.lex-input-row {
  display: flex;
  gap: .5rem;
  align-items: flex-end;
}
#lex-input {
  flex: 1;
  border: 1.5px solid #e2e8f0;
  border-radius: 12px;
  padding: .65rem .85rem;
  font-size: .875rem;
  line-height: 1.5;
  resize: none;
  outline: none;
  min-height: 44px;
  max-height: 180px;
  overflow-y: auto;
  transition: border-color .15s;
  background: #fff;
  color: #1e293b;
  font-family: inherit;
}
#lex-input:focus { border-color: #0f172a; }
#lex-send {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: none;
  background: #1a2744;
  color: #fff;
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .15s, opacity .15s;
}
#lex-send:hover { background: #0f172a; }
#lex-send:disabled { opacity: .45; cursor: default; }

/* Status note */
#lex-status-note {
  font-size: .75rem;
  color: #94a3b8;
  display: flex;
  align-items: center;
  gap: .4rem;
  font-style: italic;
}
#lex-status-note.ok { color: #64748b; font-style: normal; }
#lex-status-note.error { color: #f87171; font-style: italic; }

/* Web search toggle */
.lex-web-toggle {
  display: flex;
  align-items: center;
  gap: .4rem;
  font-size: .76rem;
  color: #64748b;
  cursor: pointer;
  user-select: none;
}
.lex-web-toggle input { cursor: pointer; accent-color: #0e6e82; }
.lex-web-toggle.active { color: #0e6e82; font-weight: 600; }

/* Citations */
.lex-citations {
  margin-top: .5rem;
  border-top: 1px solid rgba(0,0,0,.07);
  padding-top: .4rem;
  display: flex;
  flex-direction: column;
  gap: .3rem;
}
.lex-citation {
  font-size: .72rem;
  color: #64748b;
  display: flex;
  gap: .35rem;
  align-items: flex-start;
}
.lex-citation-num {
  background: #e2e8f0;
  color: #475569;
  font-weight: 700;
  border-radius: 3px;
  padding: 0 4px;
  font-size: .68rem;
  flex-shrink: 0;
  margin-top: 1px;
}
.lex-web-tag {
  font-size: .68rem;
  padding: 1px 6px;
  border-radius: 10px;
  background: rgba(14,110,130,.1);
  color: #0e6e82;
  font-weight: 600;
  flex-shrink: 0;
}

/* Responsive */
@media (max-width: 767px) {
  #lex-topbar { padding: 0 .75rem; height: 52px; }
  #lex-messages { padding: 1rem .75rem .75rem; }
  #lex-bottom { padding: .65rem .75rem .75rem; }
  .lex-msg { max-width: 96%; }
  #lex-starters { display: none; }
  .lex-brand-info .lex-badges { display: none; }
}
</style>

<div id="lex-shell">

  <!-- ── TOPBAR ── -->
  <div id="lex-topbar">
    <div class="lex-brand">
      <div class="lex-logo-circle">
        <i class="bi bi-scales"></i>
      </div>
      <div class="lex-brand-info">
        <span class="lex-name">Lex AI</span>
        <div class="lex-badges">
          <span id="badge-companion" class="lex-badge lex-badge-companion">Companion offline</span>
          <span id="badge-voice" class="lex-badge lex-badge-voice">Voce attiva</span>
        </div>
      </div>
    </div>

    <div class="lex-topbar-actions">
      <button class="lex-icon-btn" id="btn-export-session" title="Scarica conversazione">
        <i class="bi bi-download"></i>
      </button>
      <button class="lex-icon-btn" id="btn-fullscreen" title="Schermo intero">
        <i class="bi bi-arrows-fullscreen"></i>
      </button>
      <button class="lex-icon-btn active" id="btn-sound" title="Attiva/disattiva suono">
        <i class="bi bi-volume-up-fill"></i>
      </button>
      <button class="lex-icon-btn" id="btn-reset" title="Nuova conversazione">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <a class="lex-icon-btn" href="{{ url_for('home') }}" title="Torna alla dashboard">
        <i class="bi bi-x-lg"></i>
      </a>
    </div>
  </div>

  <!-- ── MESSAGES ── -->
  <div id="lex-messages">
    <div id="lex-greeting">
      <div class="lex-avatar-row">
        <div class="lex-avatar"><i class="bi bi-scales"></i></div>
        <div class="lex-greeting-bubble">Ciao, sono Lex.</div>
      </div>
    </div>
  </div>

  <!-- ── BOTTOM PANEL ── -->
  <div id="lex-bottom">

    <!-- Mode chips -->
    <div id="lex-modes">
      <button class="lex-mode-chip active"
              data-mode="general"
              data-label="Operativo"
              data-ph="Scrivi una domanda operativa sullo studio, sui fascicoli o sul deposito telematico...">
        Lex Operativo
      </button>
      <button class="lex-mode-chip"
              data-mode="fascicolo"
              data-label="Fascicolo"
              data-ph="Chiedi informazioni su un fascicolo, deposito o atti processuali...">
        Lex Fascicolo
      </button>
      <button class="lex-mode-chip"
              data-mode="udienza"
              data-label="Udienza"
              data-ph="Chiedi su udienze, scadenze, agenda o preparazione udienza...">
        Lex Udienza
      </button>
      <button class="lex-mode-chip"
              data-mode="telematico"
              data-label="Telematico"
              data-ph="Chiedi sul deposito telematico, PCT, PolisWeb, PDP o PAT...">
        Lex Telematico
      </button>
    </div>

    <!-- Quick starters -->
    <div id="lex-starters">
      <button class="lex-starter" data-prompt="Dammi il quadro della situazione studio: agenda di oggi, scadenze imminenti e fascicoli attivi">
        <i class="bi bi-grid-1x2"></i> Panoramica studio
      </button>
      <button class="lex-starter" data-prompt="Scrivi una diffida formale">
        <i class="bi bi-file-earmark-text"></i> Scrivi diffida
      </button>
      <button class="lex-starter" data-prompt="Cerca nel web le ultime sentenze rilevanti su licenziamento e Jobs Act">
        <i class="bi bi-search"></i> Cerca giurisprudenza
      </button>
      <button class="lex-starter" data-prompt="Crea una bozza di contratto di locazione ad uso abitativo">
        <i class="bi bi-house"></i> Contratto locazione
      </button>
      <button class="lex-starter" data-prompt="Rivedi questo contratto e segnala le clausole problematiche">
        <i class="bi bi-eye"></i> Rivedi contratto
      </button>
    </div>

    <!-- Upload + voice -->
    <div class="lex-upload-row">
      <label class="lex-upload-btn" for="lex-file-input">
        <i class="bi bi-paperclip"></i> Carica documenti
      </label>
      <input type="file" id="lex-file-input" multiple accept=".pdf,.docx,.doc,.txt,.jpg,.jpeg,.png" hidden>
      <button class="lex-voice-btn" id="btn-detta" title="Dettatura vocale">
        <i class="bi bi-mic-fill"></i> Detta
      </button>
    </div>

    <!-- Attachments preview -->
    <div id="lex-attachments"></div>

    <!-- Input row with web search toggle -->
    <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:.25rem;">
      <label class="lex-web-toggle" id="web-toggle-label">
        <input type="checkbox" id="web-toggle">
        <i class="bi bi-globe2"></i>
        <span>Cerca nel web</span>
      </label>
      <span id="lex-context-hint" style="font-size:.72rem;color:#94a3b8;margin-left:auto;"></span>
    </div>

    <div class="lex-input-row">
      <textarea id="lex-input" rows="1"
        placeholder="Scrivi una domanda operativa sullo studio, sui fascicoli o sul deposito telematico..."></textarea>
      <button id="lex-send" disabled>
        <i class="bi bi-send-fill"></i>
      </button>
    </div>

    <!-- Status -->
    <div id="lex-status-note">
      <i class="bi bi-info-circle"></i>
      <span id="lex-status-text">Verifica connessione al modello...</span>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';

  /* ── ENDPOINTS ── */
  const CHAT_URL     = "{{ url_for('assistente.assistente_chat') }}";
  const STATUS_URL   = "{{ url_for('assistente.assistente_stato') }}";
  const DOC_URL      = "{{ url_for('assistente.assistente_documento') }}";
  const ATT_URL      = "{{ url_for('assistente.assistente_attachments') }}";

  /* ── STATE ── */
  let history      = [];
  let attachments  = [];
  let streaming    = false;
  let soundOn      = true;
  let webSearch    = false;
  let currentMode  = 'general';
  let currentFascicoloId = '';
  const sessionId  = 'lex-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);

  /* ── DOM REFS ── */
  const shell       = document.getElementById('lex-shell');
  const messages    = document.getElementById('lex-messages');
  const greeting    = document.getElementById('lex-greeting');
  const input       = document.getElementById('lex-input');
  const sendBtn     = document.getElementById('lex-send');
  const attContainer = document.getElementById('lex-attachments');
  const statusNote  = document.getElementById('lex-status-note');
  const statusText  = document.getElementById('lex-status-text');
  const badgeComp   = document.getElementById('badge-companion');
  const badgeVoice  = document.getElementById('badge-voice');
  const contextHint = document.getElementById('lex-context-hint');
  const webToggle   = document.getElementById('web-toggle');
  const webLabel    = document.getElementById('web-toggle-label');

  /* ── AUTO-DETECT PAGE CONTEXT ── */
  (function detectPageContext () {
    const path = window.location.pathname;
    // Fascicolo: /fascicoli/<id>/...
    const mFasc = path.match(/\/fascicoli\/([^/]+)/);
    if (mFasc) {
      currentFascicoloId = mFasc[1];
      setMode('fascicolo');
      contextHint.textContent = 'Contesto: fascicolo ' + currentFascicoloId.slice(0, 8) + '…';
      return;
    }
    if (/\/(agenda|calendario)/.test(path)) {
      setMode('udienza'); contextHint.textContent = 'Contesto: agenda'; return;
    }
    if (/\/scadenziario/.test(path)) {
      setMode('udienza'); contextHint.textContent = 'Contesto: scadenziario'; return;
    }
    if (/\/(polisWeb|pdp|pat|telematico|sigit)/.test(path)) {
      setMode('telematico'); contextHint.textContent = 'Contesto: telematico'; return;
    }
  })();

  /* ── MODE CHIPS ── */
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.lex-mode-chip').forEach(c => {
      const active = c.dataset.mode === mode;
      c.classList.toggle('active', active);
      if (active) {
        const ph = c.dataset.ph;
        if (ph) input.placeholder = ph;
      }
    });
  }
  document.querySelectorAll('.lex-mode-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      setMode(chip.dataset.mode);
      input.focus();
    });
  });

  /* ── QUICK STARTERS ── */
  document.querySelectorAll('.lex-starter').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.prompt;
      adjustHeight();
      sendBtn.disabled = false;
      input.focus();
    });
  });

  /* ── WEB SEARCH TOGGLE ── */
  webToggle.addEventListener('change', () => {
    webSearch = webToggle.checked;
    webLabel.classList.toggle('active', webSearch);
  });

  /* ── INPUT AUTO-RESIZE ── */
  function adjustHeight() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
    sendBtn.disabled = !input.value.trim() || streaming;
  }
  input.addEventListener('input', adjustHeight);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) doSend();
    }
  });

  /* ── FULLSCREEN ── */
  document.getElementById('btn-fullscreen').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      shell.requestFullscreen && shell.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const ic = document.getElementById('btn-fullscreen').querySelector('i');
    if (document.fullscreenElement) {
      ic.className = 'bi bi-fullscreen-exit';
    } else {
      ic.className = 'bi bi-arrows-fullscreen';
    }
  });

  /* ── SOUND TOGGLE ── */
  document.getElementById('btn-sound').addEventListener('click', function () {
    soundOn = !soundOn;
    this.classList.toggle('active', soundOn);
    const ic = this.querySelector('i');
    ic.className = soundOn ? 'bi bi-volume-up-fill' : 'bi bi-volume-mute';
    badgeVoice.classList.toggle('inactive', !soundOn);
    badgeVoice.textContent = soundOn ? 'Voce attiva' : 'Voce disattiva';
  });

  /* ── RESET ── */
  document.getElementById('btn-reset').addEventListener('click', () => {
    history = [];
    attachments = [];
    // remove all message elements except greeting
    Array.from(messages.children).forEach(el => {
      if (el.id !== 'lex-greeting') el.remove();
    });
    greeting.style.display = '';
    attContainer.innerHTML = '';
    input.value = '';
    adjustHeight();
    setMode('general');
    currentFascicoloId = '';
    contextHint.textContent = '';
  });

  /* ── EXPORT SESSION ── */
  document.getElementById('btn-export-session').addEventListener('click', () => {
    const lines = history.map(m =>
      (m.role === 'user' ? 'Tu: ' : 'Lex: ') + m.content
    ).join('\n\n---\n\n');
    const blob = new Blob([lines], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lex-conversazione-' + new Date().toISOString().slice(0,10) + '.txt';
    a.click();
  });

  /* ── VOICE INPUT (Web Speech API) ── */
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const detBtn = document.getElementById('btn-detta');
  let recognition = null;
  let recording = false;

  if (SpeechRec) {
    recognition = new SpeechRec();
    recognition.lang = 'it-IT';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onresult = e => {
      const transcript = e.results[0][0].transcript;
      input.value = (input.value ? input.value + ' ' : '') + transcript;
      adjustHeight();
    };
    recognition.onend = () => {
      recording = false;
      detBtn.classList.remove('recording');
      detBtn.querySelector('i').className = 'bi bi-mic-fill';
      detBtn.querySelector('span') && (detBtn.querySelector('span').textContent = ' Detta');
    };
    recognition.onerror = () => recognition.onend();
  } else {
    detBtn.title = 'Dettatura non supportata da questo browser';
    detBtn.style.opacity = '.5';
  }
  detBtn.addEventListener('click', () => {
    if (!SpeechRec) return;
    if (recording) {
      recognition.stop();
    } else {
      recording = true;
      detBtn.classList.add('recording');
      detBtn.querySelector('i').className = 'bi bi-mic-fill';
      recognition.start();
    }
  });

  /* ── FILE UPLOAD ── */
  document.getElementById('lex-file-input').addEventListener('change', async function () {
    const files = Array.from(this.files);
    if (!files.length) return;
    const payloads = await Promise.all(files.map(f => fileToPayload(f)));
    try {
      const r = await fetch(ATT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: payloads }),
      });
      const d = await r.json();
      (d.attachments || []).forEach(att => {
        attachments.push(att);
        renderAttChip(att);
      });
    } catch {
      payloads.forEach(p => {
        const att = { name: p.name, kind: 'file', content: p.content };
        attachments.push(att);
        renderAttChip(att);
      });
    }
    this.value = '';
  });

  function fileToPayload(f) {
    return new Promise(res => {
      const reader = new FileReader();
      reader.onload = e => res({ name: f.name, content: e.target.result.split(',')[1] || e.target.result, mime: f.type });
      f.type.startsWith('text') ? reader.readAsText(f) : reader.readAsDataURL(f);
    });
  }

  function renderAttChip(att) {
    const chip = document.createElement('span');
    chip.className = 'lex-att-chip';
    chip.innerHTML = `<i class="bi bi-paperclip"></i>${att.name || 'allegato'}<button title="Rimuovi">&times;</button>`;
    chip.querySelector('button').addEventListener('click', () => {
      const idx = attachments.indexOf(att);
      if (idx > -1) attachments.splice(idx, 1);
      chip.remove();
    });
    attContainer.appendChild(chip);
  }

  /* ── STATUS CHECK ── */
  async function checkStatus() {
    try {
      const r = await fetch(STATUS_URL);
      const d = await r.json();
      if (d.ok) {
        badgeComp.textContent = d.modello_attivo || 'online';
        badgeComp.classList.add('online');
        statusNote.className = 'ok';
        statusNote.querySelector('i').className = 'bi bi-check-circle';
        statusText.textContent = 'Modello ' + (d.modello_attivo || 'locale') + ' attivo.';
      } else {
        badgeComp.textContent = 'Companion offline';
        badgeComp.classList.remove('online');
        statusNote.className = 'error';
        statusNote.querySelector('i').className = 'bi bi-exclamation-triangle';
        statusText.textContent = d.errore || 'Modello locale non raggiungibile.';
      }
    } catch {
      badgeComp.textContent = 'Companion offline';
      badgeComp.classList.remove('online');
      statusNote.className = 'error';
      statusNote.querySelector('i').className = 'bi bi-exclamation-triangle';
      statusText.textContent = 'Il browser non riesce a raggiungere il companion locale su questo dispositivo.';
    }
  }
  checkStatus();

  /* ── APPEND MESSAGE ── */
  function appendMsg(role, content, typing) {
    if (greeting.style.display !== 'none') greeting.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'lex-msg ' + role;
    const initial = role === 'user' ? '<i class="bi bi-person-fill"></i>' : '<i class="bi bi-scales"></i>';
    wrap.innerHTML = `
      <div class="lex-msg-avatar">${initial}</div>
      <div class="lex-msg-body">
        <div class="lex-bubble" id="bubble-${Date.now()}">
          ${typing ? '<div class="lex-typing-dots"><span></span><span></span><span></span></div>' : ''}
        </div>
      </div>`;
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return wrap.querySelector('.lex-bubble');
  }

  /* ── MARKDOWN RENDERER ── */
  function mdToHtml(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/```[\s\S]*?```/g, m => `<pre><code>${m.slice(3,-3).replace(/^[\w-]+\n/,'')}</code></pre>`)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>')
      .replace(/^#{1,3}\s+(.+)$/gm,'<h3>$1</h3>')
      .replace(/^---$/gm,'<hr>')
      .replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>')
      .replace(/^\d+\.\s+(.+)$/gm,'<li>$1</li>')
      .replace(/\n{2,}/g,'</p><p>')
      .replace(/^(?!<[huplco])/gm, '$&')
      .replace(/\n/g,'<br>')
      .replace(/^(.+)$/, '<p>$1</p>');
  }

  function setBubble(bubble, text) {
    bubble.innerHTML = mdToHtml(text);
  }

  function addActionButtons(bubble, role, content) {
    if (role !== 'assistant') return;
    const wrap = document.createElement('div');
    wrap.className = 'lex-msg-actions';
    wrap.innerHTML = `
      <button class="lex-msg-action" data-action="copy">
        <i class="bi bi-clipboard"></i> Copia
      </button>
      <button class="lex-msg-action" data-action="export">
        <i class="bi bi-file-word"></i> Esporta .docx
      </button>`;
    wrap.querySelector('[data-action="copy"]').addEventListener('click', () => {
      navigator.clipboard.writeText(content).catch(() => {});
      const btn = wrap.querySelector('[data-action="copy"]');
      btn.innerHTML = '<i class="bi bi-check2"></i> Copiato';
      setTimeout(() => btn.innerHTML = '<i class="bi bi-clipboard"></i> Copia', 1800);
    });
    wrap.querySelector('[data-action="export"]').addEventListener('click', () => exportDocx(content));
    bubble.parentElement.appendChild(wrap);
  }

  /* ── EXPORT DOCX ── */
  async function exportDocx(answer) {
    const lastUser = [...history].reverse().find(m => m.role === 'user');
    try {
      const r = await fetch(DOC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          answer,
          question: lastUser ? lastUser.content : '',
          context_label: currentMode,
        }),
      });
      if (r.ok) {
        const blob = await r.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'lex-risposta.docx';
        a.click();
      }
    } catch {}
  }

  /* ── SEND ── */
  sendBtn.addEventListener('click', doSend);

  function doSend() {
    const text = input.value.trim();
    if (!text || streaming) return;

    // If web search toggle is on, prefix the query for detection
    const effectiveText = webSearch && !text.toLowerCase().includes('cerca nel web')
      ? 'Cerca nel web: ' + text
      : text;

    history.push({ role: 'user', content: effectiveText });
    appendMsg('user', text);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    streaming = true;

    // Show typing bubble
    const bubble = appendMsg('assistant', '', true);

    fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: sessionId,
        messages: history.slice(-12),
        fascicolo_id: currentFascicoloId || '',
        mode: currentMode,
        attachments: attachments,
        allow_web_search: webSearch,
        page_section: currentMode,
      }),
    })
    .then(r => {
      if (!r.body) throw new Error('no stream');
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let accumulated = '';

      function readChunk() {
        reader.read().then(({ done, value }) => {
          if (done) { finalize(bubble, accumulated); return; }
          const chunk = dec.decode(value, { stream: true });
          chunk.split('\n').forEach(line => {
            if (!line.startsWith('data:')) return;
            const payload = line.slice(5).trim();
            if (payload === '[DONE]') { finalize(bubble, accumulated); return; }
            try {
              const obj = JSON.parse(payload);
              const tok = obj.token || obj.content || '';
              if (tok) {
                accumulated += tok;
                setBubble(bubble, accumulated);
                messages.scrollTop = messages.scrollHeight;
              }
              if (obj.done) { finalize(bubble, accumulated); return; }
            } catch {}
          });
          readChunk();
        }).catch(() => finalize(bubble, accumulated));
      }
      readChunk();
    })
    .catch(() => {
      setBubble(bubble, 'Errore di connessione. Verifica che il modello locale sia attivo.');
      finalize(bubble, '');
    });
  }

  function finalize(bubble, text) {
    streaming = false;
    attachments = [];
    attContainer.innerHTML = '';
    sendBtn.disabled = !input.value.trim();
    if (text) {
      history.push({ role: 'assistant', content: text });
      setBubble(bubble, text);
      addActionButtons(bubble, 'assistant', text);
      if (soundOn) playTone();
    } else if (!bubble.querySelector('.lex-typing-dots')) {
      // keep error message
    } else {
      setBubble(bubble, 'Nessuna risposta ricevuta dal modello.');
    }
    messages.scrollTop = messages.scrollHeight;
  }

  /* ── SUBTLE COMPLETION TONE ── */
  function playTone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.4);
    } catch {}
  }

  /* ── SEND BUTTON STATE ── */
  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim() || streaming;
  });

})();
</script>
{% endblock %}
