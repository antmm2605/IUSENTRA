name: iusentra

x-iusentra-env: &iusentra-env
  TZ: ${TZ:-Europe/Rome}
  PCT_HTTPS: "true"
  PCT_DATA_ROOT: /data
  PCT_MULTI_TENANT: "1"
  PCT_STORAGE_MODE: SQLITE
  PCT_SQLITE_MODE: "1"
  DATABASE_URL: ${DATABASE_URL:-sqlite:////data/iusentra.sqlite}
  REDIS_URL: redis://redis:6379/0
  RATELIMIT_STORAGE_URI: redis://redis:6379/1
  PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-1}
  # Presidio memoria: 3 worker gevent bastano per lo studio e liberano ~0,5-1 GB
  # rispetto a 4; il riciclo a 500 richieste contiene la frammentazione dei worker.
  # Nessun mem_limit di default sui container: i cap rigidi trasformano un picco
  # in kill-loop deterministici (Ollama in primis se il modello supera il cap).
  # Per riattivarli: IUSENTRA_APP_MEM_LIMIT ecc. nel .env e mem_limit nel compose.
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-1800}
  GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-500}
  # Ollama: punta a http://ollama:11434 se il profilo `ai` è attivo,
  # altrimenti a http://host.docker.internal:11434 per istanza host-level.
  # Impostare PCT_LOCAL_AI_ENABLED=0 per disabilitare completamente l'AI locale.
  PCT_LOCAL_AI_BASE_URL: ${PCT_LOCAL_AI_BASE_URL:-http://ollama:11434/api/version}
  PCT_LOCAL_AI_CHAT_MODEL: ${PCT_LOCAL_AI_CHAT_MODEL:-gemma3:1b}
  PCT_LOCAL_AI_ENABLED: ${PCT_LOCAL_AI_ENABLED:-1}
  PCT_STUDIO_NOME: ${PCT_STUDIO_NOME:-IUSENTRA}
  IUSENTRA_BACKUP_DIR: /opt/iusentra/backups
  IUSENTRA_HOST_IUSENTRA_DIR: /host/opt/iusentra
  IUSENTRA_EMAIL_ATTACHMENT_STORAGE: ${IUSENTRA_EMAIL_ATTACHMENT_STORAGE:-archive}
  IUSENTRA_LEGAL_AUTOFETCH_SOURCE_BUDGET: ${IUSENTRA_LEGAL_AUTOFETCH_SOURCE_BUDGET:-2}
  IUSENTRA_LEGAL_UPDATES_ITEM_TIMEOUT_SECONDS: ${IUSENTRA_LEGAL_UPDATES_ITEM_TIMEOUT_SECONDS:-120}
  IUSENTRA_LEGAL_UPDATES_PUBLISH_MAX_ITEMS: ${IUSENTRA_LEGAL_UPDATES_PUBLISH_MAX_ITEMS:-5}
  IUSENTRA_CASSAZIONE_LATEST_MAX_ITEMS: ${IUSENTRA_CASSAZIONE_LATEST_MAX_ITEMS:-5}
  IUSENTRA_UNLIMITED_OCR_ENABLED: ${IUSENTRA_UNLIMITED_OCR_ENABLED:-0}
  IUSENTRA_UNLIMITED_OCR_ENDPOINT: ${IUSENTRA_UNLIMITED_OCR_ENDPOINT:-http://unlimited-ocr:10000}
  IUSENTRA_UNLIMITED_OCR_MODEL: ${IUSENTRA_UNLIMITED_OCR_MODEL:-Unlimited-OCR}
  IUSENTRA_UNLIMITED_OCR_PROVIDER: ${IUSENTRA_UNLIMITED_OCR_PROVIDER:-self_hosted}
  IUSENTRA_UNLIMITED_OCR_TIMEOUT_SECONDS: ${IUSENTRA_UNLIMITED_OCR_TIMEOUT_SECONDS:-300}
  IUSENTRA_UNLIMITED_OCR_CONCURRENCY: ${IUSENTRA_UNLIMITED_OCR_CONCURRENCY:-2}
  IUSENTRA_UNLIMITED_OCR_MAX_PAGES: ${IUSENTRA_UNLIMITED_OCR_MAX_PAGES:-48}
  IUSENTRA_UNLIMITED_OCR_STREAM: ${IUSENTRA_UNLIMITED_OCR_STREAM:-1}
  PCT_AGENDA_DB: /data/agenda/appuntamenti.json
  PCT_CLIENTI_DB: /data/clienti/anagrafica.json
  PCT_CONDIVISIONI_DB: /data/clienti/condivisioni.json
  PCT_SOGGETTI_DB: /data/soggetti/anagrafica.json
  PCT_SOGGETTI_PARTI_DB: /data/soggetti/parti.json
  PCT_FASCICOLI_DB: /data/fascicoli/fascicoli.json
  PCT_FASCICOLI_DOCS: /data/fascicoli/documenti
  PCT_FASCICOLI_ARCH: /data/fascicoli/archivio
  PCT_PRACTICE_ENGINE_DB: /data/fascicoli/practice_engine/practice_engine.json
  PCT_MESSAGGI_DB: /data/messaggi/storico.json
  PCT_EMAIL_DB: /data/email/casella.json
  PCT_EMAIL_ORDINARIA_DB: /data/email/ordinaria.json
  PCT_BACKUP_DIR: /data/backup
  PCT_AUTH_DB: /data/auth/utenti.json
  PCT_AUDIT_DB: /data/auth/audit.json
  PCT_SUPPORT_DB: /data/support/assistenza_remota.db
  PCT_SUPPORT_STUN_URLS: ${PCT_SUPPORT_STUN_URLS:-stun:stun.l.google.com:19302}
  PCT_SCADENZIARIO_DB: /data/scadenziario/scadenze.json
  PCT_TIMESHEET_DB: /data/timesheet/entries.json
  PCT_TIME_TRACKING_DB: /data/timesheet/time_tracking.json
  PCT_NOTIFICATIONS_DB: /data/notifications/notifications.db
  PCT_SEARCH_INDEX: /data/search/index.db
  PCT_OCR_QUEUE_DB: /data/search/ocr_jobs.db
  PCT_PRIVACY_DB: /data/privacy/registro.json
  PCT_PORTALE_DB: /data/portale/portali.json
  PCT_PORTALE_UPLOADS: /data/portale/uploads
  PCT_PORTALE_IMPORT_LOG_DB: /data/portale/import_log.json
  PCT_FATTURAZIONE_DB: /data/fatturazione/parcelle.json
  PCT_PREVENTIVI_DB: /data/preventivi/preventivi.json
  PCT_NOTIFICHE_LOG: /data/notifiche/log.json
  PCT_GIURISPRUDENZA_DB: /data/intelligence/giurisprudenza.json
  PCT_WORKSPACE_INTELLIGENCE_DB: /data/intelligence/workspace_intelligence.json
  PCT_LEGAL_INTELLIGENCE_DB: /data/intelligence/motori.json
  PCT_NORMATIVE_TABLES_DB: /data/intelligence/tabelle_normative.json
  PCT_LEX_OFFICIAL_DB: /data/fonti_ufficiali/lex_sources.sqlite
  PCT_LEX_OFFICIAL_JSONL: /data/fonti_ufficiali/index/lex_sources_chunks.jsonl
  PCT_NORMATTIVA_DB: /data/normativa/normattiva.sqlite
  PCT_NORMATTIVA_JSONL: /data/normativa/index/normattiva_chunks.jsonl
  PCT_VALIDATION_RUNS_DB: /data/intelligence/validation_runs.json
  PCT_REDACTION_ASSISTANT_DB: /data/intelligence/assistente_redazionale.json
  PCT_TELEMATICO_DB: /data/telematico/workflow.db
  PCT_TEMPLATE_ATTI_DB: /data/template_atti/templates.json
  PCT_TEMPLATE_ATTI_PREFS_DB: /data/template_atti/editor_layout.json
  PCT_PAGAMENTI_DIR: /data/pagamenti
  PCT_UFFICI_DB: /data/uffici/uffici_giudiziari.json
  PCT_TENANTS_REGISTRY: /data/tenants.json
  PCT_STUDIO_CONFIG: /data/config/studio.json
  IUSENTRA_WEB_PUSH_ENABLED: ${IUSENTRA_WEB_PUSH_ENABLED:-0}
  IUSENTRA_VAPID_PUBLIC_KEY: ${IUSENTRA_VAPID_PUBLIC_KEY:-}
  IUSENTRA_VAPID_PRIVATE_KEY: ${IUSENTRA_VAPID_PRIVATE_KEY:-}
  IUSENTRA_VAPID_SUBJECT: ${IUSENTRA_VAPID_SUBJECT:-mailto:admin@example.com}

services:
  # ── Core: Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Core: App Flask ──────────────────────────────────────────────────────────
  audit-worm:
    profiles: ["audit-worm"]
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AUDIT_WORM_ACCESS_KEY:?Impostare AUDIT_WORM_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AUDIT_WORM_SECRET_KEY:?Impostare AUDIT_WORM_SECRET_KEY}
      MINIO_REGION_NAME: ${AUDIT_WORM_REGION:-eu-central-1}
      MINIO_API_OBJECT_LOCK: "on"
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}/audit-worm:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  audit-worm-init:
    profiles: ["audit-worm"]
    image: quay.io/minio/mc:latest
    restart: "no"
    depends_on:
      audit-worm:
        condition: service_healthy
    environment:
      AUDIT_WORM_ACCESS_KEY: ${AUDIT_WORM_ACCESS_KEY:?Impostare AUDIT_WORM_ACCESS_KEY}
      AUDIT_WORM_SECRET_KEY: ${AUDIT_WORM_SECRET_KEY:?Impostare AUDIT_WORM_SECRET_KEY}
      AUDIT_WORM_BUCKET: ${AUDIT_WORM_BUCKET:?Impostare AUDIT_WORM_BUCKET}
      AUDIT_WORM_MODE: ${AUDIT_WORM_MODE:-COMPLIANCE}
      AUDIT_WORM_RETENTION_YEARS: ${AUDIT_WORM_RETENTION_YEARS:-10}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set audit-worm http://audit-worm:9000 "$AUDIT_WORM_ACCESS_KEY" "$AUDIT_WORM_SECRET_KEY"
        mc mb --with-lock --ignore-existing "audit-worm/$AUDIT_WORM_BUCKET"
        mc version enable "audit-worm/$AUDIT_WORM_BUCKET"
        mc retention set --default "$AUDIT_WORM_MODE" "${AUDIT_WORM_RETENTION_YEARS}y" "audit-worm/$AUDIT_WORM_BUCKET"
        mc anonymous set none "audit-worm/$AUDIT_WORM_BUCKET"
        mc stat "audit-worm/$AUDIT_WORM_BUCKET"

  audit-postgres:
    profiles: ["audit-worm"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUDIT_POSTGRES_DB:-iusentra_audit}
      POSTGRES_USER: ${AUDIT_POSTGRES_USER:-iusentra_audit}
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?Impostare AUDIT_POSTGRES_PASSWORD}
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}/audit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${IUSENTRA_ENV_FILE:-/opt/iusentra/.env.hetzner}
    environment:
      <<: *iusentra-env
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}:/data
      - ${IUSENTRA_BACKUP_DIR:-/opt/iusentra/backups}:/opt/iusentra/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/iusentra:/host/opt/iusentra:ro
      - /run/pcscd:/run/pcscd
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/pronto', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Core: Worker scheduler ───────────────────────────────────────────────────
  scheduler-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "pct.scheduler_worker"]
    env_file:
      - ${IUSENTRA_ENV_FILE:-/opt/iusentra/.env.hetzner}
    environment:
      <<: *iusentra-env
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; cmd = Path('/proc/1/cmdline').read_text(encoding='utf-8', errors='ignore'); raise SystemExit(0 if 'pct.scheduler_worker' in cmd else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Core: Worker OCR ─────────────────────────────────────────────────────────
  ocr-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "pct.ocr_worker"]
    env_file:
      - ${IUSENTRA_ENV_FILE:-/opt/iusentra/.env.hetzner}
    environment:
      <<: *iusentra-env
      PCT_OCR_WORKERS: ${PCT_OCR_WORKERS:-2}
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}:/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; cmd = Path('/proc/1/cmdline').read_text(encoding='utf-8', errors='ignore'); raise SystemExit(0 if 'pct.ocr_worker' in cmd else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Core: Caddy HTTPS ────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - ${IUSENTRA_ENV_FILE:-/opt/iusentra/.env.hetzner}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${IUSENTRA_CADDY_DATA_DIR:-/opt/iusentra/caddy_data}:/data
      - ${IUSENTRA_CADDY_CONFIG_DIR:-/opt/iusentra/caddy_config}:/config
      - /var/log/iusentra:/var/log/iusentra
    depends_on:
      app:
        condition: service_healthy

  # ── Opzionale: Ollama AI locale (profilo `ai`) ───────────────────────────────
  # Attivare con: docker compose ... --profile ai up
  # Oppure impostare COMPOSE_PROFILES=ai in .env.hetzner.
  # Se disabilitato, l'app usa PCT_LOCAL_AI_ENABLED=0 e Lex funziona
  # senza AI locale (solo provider deterministici e research esterno).
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Opzionale: Unlimited-OCR self-hosted (profilo `unlimited-ocr`) ─────────
  # Attivare solo su host con acceleratore supportato da SGLang:
  #   COMPOSE_PROFILES=ai,unlimited-ocr
  # L'app usa questo servizio solo se IUSENTRA_UNLIMITED_OCR_ENABLED=1.
  unlimited-ocr:
    profiles: ["unlimited-ocr"]
    image: ${IUSENTRA_UNLIMITED_OCR_IMAGE:-lmsysorg/sglang:latest}
    restart: unless-stopped
    gpus: all
    shm_size: ${IUSENTRA_UNLIMITED_OCR_SHM_SIZE:-16gb}
    environment:
      HF_HOME: /models/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-${HUGGING_FACE_HUB_TOKEN:-}}
      CUDA_VISIBLE_DEVICES: ${IUSENTRA_UNLIMITED_OCR_CUDA_VISIBLE_DEVICES:-0}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}/models/unlimited-ocr:/models
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model
      - ${IUSENTRA_UNLIMITED_OCR_MODEL_DIR:-baidu/Unlimited-OCR}
      - --served-model-name
      - ${IUSENTRA_UNLIMITED_OCR_MODEL:-Unlimited-OCR}
      - --attention-backend
      - ${IUSENTRA_UNLIMITED_OCR_ATTENTION_BACKEND:-fa3}
      - --page-size
      - "1"
      - --mem-fraction-static
      - ${IUSENTRA_UNLIMITED_OCR_MEM_FRACTION_STATIC:-0.8}
      - --context-length
      - ${IUSENTRA_UNLIMITED_OCR_CONTEXT_LENGTH:-32768}
      - --enable-custom-logit-processor
      - --disable-overlap-schedule
      - --skip-server-warmup
      - --host
      - 0.0.0.0
      - --port
      - "10000"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/v1/models', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # ── Opzionale: Prometheus + Grafana (profilo `monitoring`) ───────────────────
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ../../prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}/prometheus:/prometheus
    depends_on:
      app:
        condition: service_healthy

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${IUSENTRA_DATA_DIR:-/opt/iusentra/data}/grafana:/var/lib/grafana
      - ../../monitoring:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
