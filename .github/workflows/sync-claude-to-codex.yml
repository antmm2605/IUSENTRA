name: Sync Twin Branches

on:
  push:
    branches:
      - "Codex/legal-electronic-filing-kIxcV"
      - "claude/legal-electronic-filing-kIxcV"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-peer-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Determine source and target branch
        id: branches
        shell: bash
        run: |
          source="${GITHUB_REF_NAME}"
          case "$source" in
            "Codex/legal-electronic-filing-kIxcV")
              target="claude/legal-electronic-filing-kIxcV"
              ;;
            "claude/legal-electronic-filing-kIxcV")
              target="Codex/legal-electronic-filing-kIxcV"
              ;;
            *)
              echo "Branch non supportato: $source" >&2
              exit 1
              ;;
          esac
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.branches.outputs.source }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mirror source branch into twin branch
        run: |
          git push origin "HEAD:refs/heads/${{ steps.branches.outputs.target }}" --force
