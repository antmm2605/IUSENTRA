name: CI Release Overlay

on:
  workflow_dispatch:

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install runtime dependencies
        run: pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev dependencies
        run: pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Release readiness docs
        run: python tools/check_release_readiness.py

      - name: Release readiness tests
        run: python scripts/run_pytest_phases.py --suite release-readiness --timeout-minutes 5
