name: E2E Nightly

on:
  schedule:
    # GitHub Actions usa UTC: 01:15 UTC = notte italiana (03:15 CEST / 02:15 CET)
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  e2e-full-shards:
    name: E2E full suite parte ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev deps
        run: |
          pip install -r requirements-dev.txt

      - name: Run complete E2E shard
        run: |
          # Target storici inclusi dal runner:
          # tests/e2e/test_studio_reale_flow.py
          # tests/e2e/test_ai_pipeline_full.py
          # tests/e2e/test_tenant_migration_full.py
          # tests/e2e/test_operational_crash_day.py
          python scripts/run_pytest_phases.py \
            --suite e2e-nightly \
            --suite-shard ${{ matrix.shard }} \
            --suite-total-shards 4 \
            --timeout-minutes 5

  e2e-full:
    name: E2E full suite
    runs-on: ubuntu-latest
    needs:
      - e2e-full-shards
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check E2E shards
        run: |
          if [ "${{ needs['e2e-full-shards'].result }}" != "success" ]; then
            echo "Uno o piu' shard E2E nightly non sono verdi."
            exit 1
          fi
          echo "Tutti gli shard E2E nightly sono verdi."
