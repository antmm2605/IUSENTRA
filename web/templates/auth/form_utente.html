{% extends "base.html" %}
{% block title %}{{ 'Modifica' if utente else 'Nuovo' }} Utente{% endblock %}
{% block page_title %}{{ 'Modifica' if utente else 'Nuovo' }} Utente{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-xl-7">
<form method="post">
<div class="card shadow-sm mb-3">
  <div class="card-header fw-semibold">
    <i class="bi bi-person me-2 text-primary"></i>Dati utente
  </div>
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
        <input type="text" name="username" class="form-control"
               value="{{ utente.username if utente else '' }}"
               {{ 'disabled' if utente else 'required' }}
               placeholder="mario.rossi">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Ruolo <span class="text-danger">*</span></label>
        <select name="ruolo" class="form-select" required>
          {% for r in ruoli %}
          <option value="{{ r.value }}" {{ 'selected' if utente and utente.ruolo == r }}>
            {{ r.value.replace('_',' ') }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Nome completo</label>
        <input type="text" name="nome_completo" class="form-control"
               value="{{ utente.nome_completo if utente else '' }}"
               placeholder="Avv. Mario Rossi">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ utente.email if utente else '' }}"
               placeholder="mario.rossi@studio.it">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">
          {{ 'Nuova password (lasciare vuoto per non cambiare)' if utente else 'Password *' }}
        </label>
        <input type="password" name="password" class="form-control"
               {{ '' if utente else 'required' }} minlength="8"
               placeholder="min. 8 caratteri">
      </div>
      {% if utente %}
      <div class="col-md-6 d-flex align-items-end">
        <div class="form-check form-switch ms-2">
          <input class="form-check-input" type="checkbox" name="attivo"
                 value="1" id="attivo" {{ 'checked' if utente.attivo }}>
          <label class="form-check-label fw-semibold" for="attivo">Utente attivo</label>
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</div>
<div class="d-flex gap-2 mb-4">
  <button type="submit" class="btn btn-primary">
    <i class="bi bi-check-lg me-1"></i>{{ 'Salva modifiche' if utente else 'Crea utente' }}
  </button>
  <a href="{{ url_for('lista_utenti') }}" class="btn btn-outline-secondary">Annulla</a>
</div>
</form>
</div>
</div>
{% endblock %}
