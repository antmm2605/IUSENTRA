# ============================================================
#  Railway — Configurazione deploy
#  Docs: https://docs.railway.app
# ============================================================

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - wsgi:app"
healthcheckPath = "/login"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# ============================================================
#  VARIABILI D'AMBIENTE — da impostare nel pannello Railway:
#  Settings → Variables
# ============================================================
#
#  OBBLIGATORIE:
#  PCT_SECRET_KEY   = <stringa casuale lunga 32+ caratteri>
#
#  OPZIONALI:
#  PCT_STUDIO_NOME  = "Studio Legale Rossi & Associati"
#  PCT_DOC_KEY      = <chiave per cifrare i documenti su disco>
#  PCT_SMTP_HOST    = smtp.gmail.com
#  PCT_SMTP_PORT    = 587
#  PCT_SMTP_USER    = tuo@email.com
#  PCT_SMTP_PASS    = <app-password>
#  PCT_SMTP_FROM    = tuo@email.com
#
#  VOLUME (persistenza dati):
#  Vai su: progetto → Service → Volumes → Add Volume
#  Mount path: /data
# ============================================================
