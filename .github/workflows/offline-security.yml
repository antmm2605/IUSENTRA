name: Offline devices and synthetic sync
on:
  pull_request:
    paths:
      - 'pct/offline/**'
      - 'pct/sql/20261011_offline*'
      - 'web/bootstrap/offline_routes.py'
      - 'frontend/src/features/offline/**'
      - 'tests/*offline*'
      - 'tests/js/offline_crypto.test.mjs'
      - '.github/workflows/offline-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgresql]
    services:
      postgres:
        image: ${{ matrix.backend == 'postgresql' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: offline_synthetic
          POSTGRES_USER: offline_synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U offline_synthetic -d offline_synthetic"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Registry, concurrency and recovery (under five minutes)
        env:
          OFFLINE_TEST_DSN: ${{ matrix.backend == 'postgresql' && 'host=127.0.0.1 port=5432 dbname=offline_synthetic user=offline_synthetic password=synthetic-ci-only' || '' }}
        run: timeout 300 python -m pytest tests/test_offline_sync.py -q
      - name: Flask RBAC, CSRF and cache policy (under five minutes)
        env:
          OFFLINE_TEST_DSN: ${{ matrix.backend == 'postgresql' && 'host=127.0.0.1 port=5432 dbname=offline_synthetic user=offline_synthetic password=synthetic-ci-only' || '' }}
        run: timeout 300 python -m pytest tests/test_offline_api.py -q
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test tests/js/offline_crypto.test.mjs
