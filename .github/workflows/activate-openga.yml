name: Installa ricerca pubblica OpenGA R6
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release draft dei soli dati pubblici con impronta nel repository
        required: true
        type: string
permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
concurrency:
  group: deploy-hetzner-production
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Verifica SHA e CI prima dell'installazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          python tools/check_github_required_gates.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --event push --wait --timeout-seconds 1800 --poll-seconds 30
      - name: Prepara soli dati pubblici verificati
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^openga-r6-[0-9]{8}-dati$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          test "$(jq -r .draft release.json)" = true
          name=$(jq -r .asset deploy/openga/pacchetto.json)
          asset=$(jq -er --arg n "$name" '.assets[] | select(.name == $n) | .id' release.json)
          gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$asset" > "$RUNNER_TEMP/$name"
          expected=$(jq -r .sha256 deploy/openga/pacchetto.json)
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$name" | sha256sum -c -
      - name: Installa senza sovrascrivere corpus e avvia motore privato
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          HETZNER_HOST: ${{ vars.HETZNER_HOST || '116.203.45.57' }}
          HETZNER_USER: ${{ vars.HETZNER_USER || 'root' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'shred -u ~/.ssh/id_deploy' EXIT
          target="${HETZNER_USER}@${HETZNER_HOST}"
          options=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote="/opt/iusentra/import/openga-r6-${GITHUB_SHA}"
          ssh "${options[@]}" "$target" "test \"\$(git -C /opt/iusentra/repo rev-parse HEAD)\" = '$GITHUB_SHA'; mkdir -p '$remote'"
          scp "${options[@]}" "$RUNNER_TEMP/openga-r6-dati.tar.gz" "$target:$remote/"
          ssh "${options[@]}" "$target" "cd /opt/iusentra/repo && bash deploy/openga/activate.sh '$GITHUB_SHA' '$remote/openga-r6-dati.tar.gz'" | tee esito-installazione.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openga-installazione
          path: esito-installazione.log
          if-no-files-found: warn
