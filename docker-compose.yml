# =============================================================================
#  IUSENTRA | Docker Compose (versione web integrale)
#
#  Avvio rapido:
#    1. cp .env.example .env          (solo la prima volta)
#    2. docker compose up --build     (prima volta — compila l'immagine)
#    3. docker compose up -d          (volte successive — in background)
#
#  Accesso:
#    http://localhost       → via Nginx (porta 80)  ← consigliato
#    http://localhost:8080  → diretto a Gunicorn      (debug / bypass)
#
#  Bootstrap locale: IUSENTRA crea l'utente admin con password temporanea.
#  Se PCT_BOOTSTRAP_ADMIN_PASSWORD non è impostata, la password viene generata
#  al primo avvio e salvata in ./data/auth/bootstrap_admin.json.
#  IUSENTRA impone sempre il cambio password obbligatorio al primo accesso.
#
#  Dati persistenti: cartella ./data/  sul tuo PC
#  Stop:   docker compose down
#  Reset:  docker compose down -v  (ATTENZIONE: cancella tutti i dati!)
# =============================================================================

services:

  # --------------------------------------------------------------------------
  #  App Flask / Gunicorn
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iusentra-app
    restart: unless-stopped

    # Porta diretta (utile per debug o ambienti senza nginx)
    ports:
      - "${IUSENTRA_PORT:-8080}:8080"

    volumes:
      # Dati persistenti montati dalla cartella ./data/ del progetto
      - ./data:/data
      # PKCS#11 / Aruba Key: condivide il socket del demone pcscd dell'host
      # con il container, così opensc-pkcs11.so vede i token USB collegati.
      # Prerequisiti HOST: apt install pcscd opensc && systemctl start pcscd
      # Se non usi firma PKCS#11 puoi commentare questa riga.
      - /run/pcscd:/run/pcscd

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      # In locale non serve HTTPS forzato (nginx gestisce i redirect)
      PCT_HTTPS: "false"
      PCT_STORAGE_MODE: "SQLITE"
      # Percorsi dati (ridondanti rispetto al Dockerfile, ma espliciti qui)
      PCT_DATA_ROOT:      /data
      PCT_AGENDA_DB:        /data/agenda/appuntamenti.json
      PCT_CLIENTI_DB:       /data/clienti/anagrafica.json
      PCT_CONDIVISIONI_DB:  /data/clienti/condivisioni.json
      PCT_SOGGETTI_DB:      /data/soggetti/anagrafica.json
      PCT_SOGGETTI_PARTI_DB: /data/soggetti/parti.json
      PCT_FASCICOLI_DB:     /data/fascicoli/fascicoli.json
      PCT_FASCICOLI_DOCS:   /data/fascicoli/documenti
      PCT_FASCICOLI_ARCH:   /data/fascicoli/archivio
      PCT_MESSAGGI_DB:      /data/messaggi/storico.json
      PCT_BACKUP_DIR:       /data/backup
      PCT_AUTH_DB:          /data/auth/utenti.json
      PCT_AUDIT_DB:         /data/auth/audit.json
      PCT_SUPPORT_DB:       /data/support/assistenza_remota.db
      PCT_SCADENZIARIO_DB:  /data/scadenziario/scadenze.json
      PCT_SEARCH_INDEX:     /data/search/index.db
      PCT_OCR_QUEUE_DB:     /data/search/ocr_jobs.db
      PCT_SQLITE_MODE:      "1"
      PCT_PRIVACY_DB:       /data/privacy/registro.json
      PCT_PORTALE_DB:       /data/portale/portali.json
      PCT_PORTALE_UPLOADS:  /data/portale/uploads
      PCT_PORTALE_IMPORT_LOG_DB: /data/portale/import_log.json
      PCT_FATTURAZIONE_DB:  /data/fatturazione/parcelle.json
      PCT_GIURISPRUDENZA_DB: /data/intelligence/giurisprudenza.json
      PCT_NOTIFICHE_LOG:    /data/notifiche/log.json
      PCT_TEMPLATE_ATTI_DB: /data/template_atti/templates.json
      PCT_PAGAMENTI_DIR:    /data/pagamenti
      PCT_TIME_TRACKING_DB: /data/timesheet/time_tracking.json
      PCT_TENANTS_REGISTRY: /data/tenants.json
      PCT_STUDIO_CONFIG:    /data/config/studio.json
      PCT_MULTI_TENANT:     "1"
      DATABASE_URL:         ${DATABASE_URL:-sqlite:////data/iusentra.sqlite}
      REDIS_URL:            ${REDIS_URL:-redis://redis:6379/0}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      PROMETHEUS_ENABLED:   ${PROMETHEUS_ENABLED:-1}
      WEB_CONCURRENCY:      ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS:     ${GUNICORN_THREADS:-4}
      GUNICORN_WORKER_CONNECTIONS: ${GUNICORN_WORKER_CONNECTIONS:-500}
      PCT_LOCAL_AI_BASE_URL: ${PCT_LOCAL_AI_BASE_URL:-http://host.docker.internal:11434/api/version}
      PCT_HOST_PLATFORM:    ${OS:-}
      PCT_HOST_MACHINE:     ${PROCESSOR_ARCHITECTURE:-}
      # PKCS#11 — percorso libreria OpenSC nel container (auto-rilevato se non impostato)
      PCT_PKCS11_LIBRARY:   /usr/lib/x86_64-linux-gnu/opensc-pkcs11.so

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/pronto', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Limiti risorse — adatta alla tua macchina (rimuovi il commento per attivarli)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 768M
    #     reservations:
    #       memory: 256M

  # --------------------------------------------------------------------------
  #  Scheduler worker dedicato
  # --------------------------------------------------------------------------
  scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iusentra-scheduler
    restart: unless-stopped
    command: ["python", "-m", "pct.scheduler_worker"]

    depends_on:
      app:
        condition: service_healthy

    volumes:
      - ./data:/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      PCT_HTTPS: "false"
      PCT_DATA_ROOT: /data
      PCT_MULTI_TENANT: "1"
      PCT_STORAGE_MODE: "SQLITE"
      PCT_SQLITE_MODE: "1"
      PCT_TIME_TRACKING_DB: /data/timesheet/time_tracking.json
      PCT_LOCAL_AI_BASE_URL: ${PCT_LOCAL_AI_BASE_URL:-http://host.docker.internal:11434/api/version}
      PCT_HOST_PLATFORM: ${OS:-}
      PCT_HOST_MACHINE: ${PROCESSOR_ARCHITECTURE:-}

    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; cmd = Path('/proc/1/cmdline').read_text(encoding='utf-8', errors='ignore'); raise SystemExit(0 if 'pct.scheduler_worker' in cmd else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --------------------------------------------------------------------------
  #  OCR worker dedicato
  # --------------------------------------------------------------------------
  ocr-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iusentra-ocr
    restart: unless-stopped
    command: ["python", "-m", "pct.ocr_worker"]

    depends_on:
      app:
        condition: service_healthy

    volumes:
      - ./data:/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      PCT_HTTPS: "false"
      PCT_DATA_ROOT: /data
      PCT_MULTI_TENANT: "1"
      PCT_STORAGE_MODE: "SQLITE"
      PCT_SQLITE_MODE: "1"
      PCT_SEARCH_INDEX: /data/search/index.db
      PCT_OCR_QUEUE_DB: /data/search/ocr_jobs.db
      PCT_OCR_WORKERS: ${PCT_OCR_WORKERS:-2}

    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; cmd = Path('/proc/1/cmdline').read_text(encoding='utf-8', errors='ignore'); raise SystemExit(0 if 'pct.ocr_worker' in cmd else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: iusentra-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  audit-worm:
    profiles: ["audit-worm"]
    image: quay.io/minio/minio:latest
    container_name: iusentra-audit-worm
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AUDIT_WORM_ACCESS_KEY:?configurare AUDIT_WORM_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${AUDIT_WORM_SECRET_KEY:?configurare AUDIT_WORM_SECRET_KEY in .env}
      MINIO_REGION_NAME: ${AUDIT_WORM_REGION:-eu-central-1}
      MINIO_API_OBJECT_LOCK: "on"
    volumes:
      - ./data/audit-worm:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  audit-worm-init:
    profiles: ["audit-worm"]
    image: quay.io/minio/mc:latest
    container_name: iusentra-audit-worm-init
    restart: "no"
    depends_on:
      audit-worm:
        condition: service_healthy
    environment:
      AUDIT_WORM_ACCESS_KEY: ${AUDIT_WORM_ACCESS_KEY:?configurare AUDIT_WORM_ACCESS_KEY in .env}
      AUDIT_WORM_SECRET_KEY: ${AUDIT_WORM_SECRET_KEY:?configurare AUDIT_WORM_SECRET_KEY in .env}
      AUDIT_WORM_BUCKET: ${AUDIT_WORM_BUCKET:?configurare AUDIT_WORM_BUCKET in .env}
      AUDIT_WORM_MODE: ${AUDIT_WORM_MODE:-COMPLIANCE}
      AUDIT_WORM_RETENTION_YEARS: ${AUDIT_WORM_RETENTION_YEARS:-10}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set audit-worm http://audit-worm:9000 "$AUDIT_WORM_ACCESS_KEY" "$AUDIT_WORM_SECRET_KEY"
        mc mb --with-lock --ignore-existing "audit-worm/$AUDIT_WORM_BUCKET"
        mc version enable "audit-worm/$AUDIT_WORM_BUCKET"
        mc retention set --default "$AUDIT_WORM_MODE" "${AUDIT_WORM_RETENTION_YEARS}y" "audit-worm/$AUDIT_WORM_BUCKET"
        mc anonymous set none "audit-worm/$AUDIT_WORM_BUCKET"
        mc stat "audit-worm/$AUDIT_WORM_BUCKET"

  audit-postgres:
    profiles: ["audit-worm"]
    image: postgres:16-alpine
    container_name: iusentra-audit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUDIT_POSTGRES_DB:-iusentra_audit}
      POSTGRES_USER: ${AUDIT_POSTGRES_USER:-iusentra_audit}
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:?configurare AUDIT_POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/audit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 10

  rq-worker:
    profiles: ["hardening"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iusentra-rq-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUES: ${RQ_QUEUES:-default,documents,email,ocr,imports}

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: iusentra-prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: iusentra-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./monitoring:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  ollama:
    profiles: ["ollama-sidecar"]
    image: ollama/ollama:latest
    container_name: iusentra-ollama
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./data/intelligence/models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


  # --------------------------------------------------------------------------
  #  Nginx — reverse proxy, gzip, cache static, SSE support
  #  Attivo di default. Porta 80.
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: iusentra-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    # Limiti risorse per nginx
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 64M


# =============================================================================
# Volume nominato (alternativa al bind-mount ./data — usa uno o l'altro)
# Per usarlo: cambia  ./data:/data  in  iusentra-data:/data  nel servizio app
# e decommenta il blocco qui sotto.
# =============================================================================
# volumes:
#   iusentra-data:
#     driver: local
