{% if g.utente_corrente %}
<div
  id="pct-ai-widget"
  class="pct-ai-widget"
  data-ai-mode="{{ 'local' if request.host.split(':')[0] in ['localhost', '127.0.0.1'] else 'remote' }}"
  data-chat-url="{{ url_for('assistente.assistente_chat') }}"
  data-status-url="{{ url_for('assistente.assistente_stato') }}"
  data-server-context-url="{{ url_for('assistente.assistente_context') }}"
  data-server-attachments-url="{{ url_for('assistente.assistente_attachments') }}"
  data-export-document-url="{{ url_for('assistente.assistente_documento') }}"
  data-local-signer-url="http://127.0.0.1:27272"
  data-local-signer-download-page="{{ url_for('impostazioni.index', tab='firma', _external=True) }}"
  data-local-signer-setup-windows="{{ url_for('polis_local_signer_setup_windows') }}"
  data-local-signer-setup-macos="{{ url_for('polis_local_signer_setup_macos') }}"
  data-local-signer-setup-linux="{{ url_for('polis_local_signer_setup_linux') }}"
  data-lex-icon-url="{{ url_for('static', filename='img/lex-mark.png') }}?v={{ app_version }}"
  data-storage-key="hacs-pct-ai-layout-v1"
>
  <button
    id="pct-ai-fab"
    class="pct-ai-fab"
    type="button"
    title="Apri l'assistente Lex"
    aria-label="Apri l'assistente Lex"
  >
    <span class="pct-ai-fab__halo" aria-hidden="true"></span>
    <span class="pct-ai-fab__icon">
      <img
        src="{{ url_for('static', filename='img/lex-mark.png') }}?v={{ app_version }}"
        alt=""
        aria-hidden="true"
        class="pct-ai-brand-mark pct-ai-brand-mark--fab"
      >
    </span>
    <span class="visually-hidden">Apri l'assistente Lex</span>
  </button>

  <section
    id="pct-ai-panel"
    class="pct-ai-panel"
    hidden
    role="dialog"
    aria-label="Assistente PCT"
    aria-modal="false"
  >
    <header
      id="pct-ai-header"
      class="pct-ai-header"
      data-pct-ai-drag-handle="true"
      title="Trascina il pannello per spostarlo"
    >
      <div class="pct-ai-header__brand">
        <div class="pct-ai-header__icon">
          <img
            src="{{ url_for('static', filename='img/lex-mark.png') }}?v={{ app_version }}"
            alt=""
            aria-hidden="true"
            class="pct-ai-brand-mark pct-ai-brand-mark--header"
          >
        </div>
        <div class="pct-ai-header__copy">
          <div class="pct-ai-header__meta">
            <span id="pct-ai-model-badge" class="pct-ai-model-badge">Verifica modello</span>
            <span id="pct-ai-voice-badge" class="pct-ai-model-badge">Voce pronta</span>
            <span class="pct-ai-drag-hint"><i class="bi bi-grip-horizontal"></i> Trascina</span>
          </div>
        </div>
      </div>
      <div class="pct-ai-header__actions">
        <button id="pct-ai-export" class="pct-ai-hbtn" type="button" title="Scarica il riepilogo della conversazione" aria-label="Scarica il riepilogo della conversazione">
          <i class="bi bi-download"></i>
        </button>
        <button id="pct-ai-voice-toggle" class="pct-ai-hbtn" type="button" title="Attiva o disattiva la risposta vocale" aria-label="Attiva o disattiva la risposta vocale">
          <i class="bi bi-volume-up-fill"></i>
        </button>
        <button id="pct-ai-reset-position" class="pct-ai-hbtn" type="button" title="Ripristina posizione e dimensioni predefinite" aria-label="Ripristina posizione e dimensioni predefinite">
          <i class="bi bi-arrow-down-right-square"></i>
        </button>
        <button id="pct-ai-clear" class="pct-ai-hbtn" type="button" title="Nuova conversazione" aria-label="Nuova conversazione">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button id="pct-ai-close" class="pct-ai-hbtn" type="button" title="Chiudi assistente" aria-label="Chiudi assistente">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </header>

    <div id="pct-ai-ctx" class="pct-ai-ctx" hidden>
      <i class="bi bi-folder2-open"></i>
      <span id="pct-ai-ctx-label"></span>
    </div>

    <div id="pct-ai-messages" class="pct-ai-messages">
      <div class="pct-ai-msg pct-ai-msg--assistant">
        <div class="pct-ai-avatar pct-ai-avatar--ai">
          <img
            src="{{ url_for('static', filename='img/lex-mark.png') }}?v={{ app_version }}"
            alt=""
            aria-hidden="true"
            class="pct-ai-brand-mark pct-ai-brand-mark--avatar"
          >
        </div>
        <div class="pct-ai-bubble">
          <p class="mb-0">Ciao, sono Lex.</p>
        </div>
      </div>
    </div>

    <footer class="pct-ai-footer">
      <div class="pct-ai-toolbar">
        <label for="pct-ai-upload" class="pct-ai-tool-btn pct-ai-tool-btn--upload" title="Carica documenti nel contesto di Lex">
          <i class="bi bi-paperclip"></i>
          <span>Carica documenti</span>
        </label>
        <input
          id="pct-ai-upload"
          class="pct-ai-upload-input"
          type="file"
          multiple
          accept=".pdf,.docx,.txt,.md,.json,.html,.htm,.csv"
        >
        <button id="pct-ai-mic" class="pct-ai-tool-btn" type="button" title="Detta la richiesta a Lex" aria-label="Detta la richiesta a Lex">
          <i class="bi bi-mic-fill"></i>
          <span>Detta</span>
        </button>
      </div>
      <div id="pct-ai-attachments" class="pct-ai-attachments" hidden></div>
      <div class="pct-ai-input-wrap">
        <textarea
          id="pct-ai-input"
          class="pct-ai-input"
          placeholder="Scrivi una domanda operativa sullo studio, sui fascicoli o sul deposito telematico..."
          rows="1"
        ></textarea>
        <button id="pct-ai-send" class="pct-ai-send-btn" type="button" title="Invia domanda" aria-label="Invia domanda">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
      <div id="pct-ai-status" class="pct-ai-status-bar">Assistente pronto.</div>
      <button id="pct-ai-resize-handle" class="pct-ai-resize-handle" type="button" title="Ridimensiona la finestra di Lex" aria-label="Ridimensiona la finestra di Lex">
        <i class="bi bi-arrows-angle-expand"></i>
      </button>
    </footer>
  </section>
</div>
{% endif %}
