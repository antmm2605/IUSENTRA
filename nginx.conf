# =============================================================================
#  HACS — Studio Legale PCT  |  Nginx (versione integrale)
#
#  Funzionalità attive:
#    • Gzip compression
#    • Cache aggressiva per /static/ (7 giorni)
#    • Service Worker: no-cache obbligatorio
#    • SSE /api/eventi: proxy_buffering off, timeout 1h
#    • Upload /fascicoli e /portale: timeout 5 min, body 200MB
#    • Security headers (X-Frame-Options, HSTS, ecc.)
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Dimensione massima upload (sovrascritta per location specifiche)
    client_max_body_size 50M;

    # ------------------------------------------------------------------
    #  Gzip
    # ------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # ------------------------------------------------------------------
    #  Security headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header X-XSS-Protection          "1; mode=block"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ------------------------------------------------------------------
    #  Impostazioni proxy comuni
    # ------------------------------------------------------------------
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    # ------------------------------------------------------------------
    #  Static files — cache 7 giorni
    # ------------------------------------------------------------------
    location /static/ {
        proxy_pass         http://app:8080;
        expires            7d;
        add_header         Cache-Control "public, max-age=604800";
        proxy_read_timeout 30s;
    }

    # Service Worker: MAI in cache — deve essere sempre aggiornato
    location = /static/sw.js {
        proxy_pass http://app:8080;
        expires    -1;
        add_header Cache-Control        "no-store, no-cache, must-revalidate, max-age=0";
        add_header Service-Worker-Allowed "/";
    }

    # Web App Manifest
    location = /static/manifest.json {
        proxy_pass http://app:8080;
        expires    1d;
        add_header Content-Type  "application/manifest+json";
        add_header Cache-Control "public, max-age=86400";
    }

    # ------------------------------------------------------------------
    #  SSE — Server-Sent Events (/api/eventi)
    #  Nessun buffering, connessione aperta fino a 1 ora
    # ------------------------------------------------------------------
    location = /api/eventi {
        proxy_pass                 http://app:8080;
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        keepalive_timeout          3600s;
        chunked_transfer_encoding  on;
        # X-Accel-Buffering: no è già inviato dall'app Flask
    }

    # ------------------------------------------------------------------
    #  Upload documenti — timeout 5 min, body max 200 MB
    # ------------------------------------------------------------------
    location ~* ^/(fascicoli/upload|portale/upload) {
        proxy_pass           http://app:8080;
        proxy_read_timeout   300s;
        client_max_body_size 200M;
    }

    # ------------------------------------------------------------------
    #  API — risposta veloce
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    #  Tutto il resto — timeout 120s (sufficiente per PDF/ZIP grandi)
    # ------------------------------------------------------------------
    location / {
        proxy_pass         http://app:8080;
        proxy_read_timeout 120s;
    }
}
