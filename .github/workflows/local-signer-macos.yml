name: Local Signer macOS (notturno)

# I test del Local Signer su macOS non bloccano il deploy (runner Mac di GitHub spesso non assegnati):
# girano ogni notte e a richiesta; un fallimento resta visibile in Actions (autorizzazione dell'avvocato 03/11/2026).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-signer-macos
  cancel-in-progress: false

jobs:
  signer-macos:
    name: Local Signer e PKCS#11 (macOS notturno) parte ${{ matrix.shard }}/4
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c requirements/constraints.txt -r requirements.txt
          pip install -c requirements/constraints.txt -r requirements-dev.txt
          pip install -c requirements/constraints.txt -r tools/requirements_local_signer.txt
      - name: Run signer shard
        run: |
          python scripts/run_pytest_phases.py --suite signer --suite-shard ${{ matrix.shard }} --suite-total-shards 4 --suite-subdivide-items --timeout-minutes 5
