name: Frontend React CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    paths:
      - "frontend/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend-checks:
    name: Frontend React ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: contratti
            command: pnpm test
          - label: typecheck
            command: pnpm typecheck
          - label: build
            command: pnpm build
          - label: storybook
            command: pnpm build:storybook
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  frontend:
    name: Frontend React CI
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check frontend shards
        run: |
          if [ "${{ needs['frontend-checks'].result }}" != "success" ]; then
            echo "Uno o piu' shard frontend non sono verdi."
            exit 1
          fi
          echo "Tutti gli shard frontend sono verdi."
