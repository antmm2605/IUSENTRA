<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1B3A">
  <meta name="csrf-token" content="{{ csrf_token if csrf_token is defined else '' }}">
  <title>Stanza operatore - IUSENTRA</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo-iusentra.png') }}">
  <link href="/static/css/app.css?v={{ app_version }}" rel="stylesheet">
  {% for css_file in react_assets.css %}
  <link rel="stylesheet" href="{{ css_file }}">
  {% endfor %}
  {% for css_file in react_assets.page_css %}
  <link rel="stylesheet" href="{{ css_file }}">
  {% endfor %}
  {% for preload_file in react_assets.preload_js %}
  <link rel="modulepreload" href="{{ preload_file }}">
  {% endfor %}
</head>
<body class="support-operator-react-page">
  <script>
    window.SUPPORT_BOOTSTRAP = {{ bootstrap | tojson }};
    window.SUPPORT_SESSION = {{ sessione | tojson }};
    window.SUPPORT_ASSET_VERSION = {{ (app_version ~ "-support-loopback-20260607") | tojson }};
  </script>
  <script id="support-operator-bootstrap" type="application/json">{{ bootstrap | tojson }}</script>
  <script id="support-operator-session" type="application/json">{{ sessione | tojson }}</script>
  <div id="support-operator-react-root" data-support-operator-room="1"></div>
  <noscript>
    <main class="support-operator-noscript">
      <h1>Stanza operatore</h1>
      <p>Abilita JavaScript per usare schermo intero, chat e controllo PC.</p>
    </main>
  </noscript>
  {% for js_file in react_assets.js %}
  <script type="module" src="{{ js_file }}"></script>
  {% endfor %}
</body>
</html>
