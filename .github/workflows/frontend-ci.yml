name: Frontend React CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend-checks:
    name: Frontend React ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: contratti
            command: npm run test
          - label: typecheck
            command: npm run typecheck
          - label: build
            command: npm run build:vite
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}

  frontend:
    name: Frontend React CI
    runs-on: ubuntu-latest
    needs:
      - frontend-checks
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check frontend shards
        run: |
          if [ "${{ needs['frontend-checks'].result }}" != "success" ]; then
            echo "Uno o piu' shard frontend non sono verdi."
            exit 1
          fi
          echo "Tutti gli shard frontend sono verdi."
