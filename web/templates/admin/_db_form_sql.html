{# Partial: parametri connessione SQL (usato sia per MySQL che PostgreSQL) #}
<div class="row g-3">
  <div class="col-12 col-sm-8">
    <label class="form-label small fw-semibold">Host <span class="text-danger">*</span></label>
    <input type="text" name="host" class="form-control" value="{{ db.host or 'localhost' }}"
           placeholder="localhost o IP" required>
  </div>
  <div class="col-12 col-sm-4">
    <label class="form-label small fw-semibold">
      Porta
      <span class="text-muted fw-normal">(default {{ db_mode_info[db.mode].porta if db.mode in db_mode_info else '' }})</span>
    </label>
    <input type="number" name="porta" class="form-control" value="{{ db.porta or '' }}"
           placeholder="{{ db_mode_info[db.mode].porta if db.mode in db_mode_info else '' }}"
           min="1" max="65535">
  </div>
  <div class="col-12 col-sm-6">
    <label class="form-label small fw-semibold">Nome Database <span class="text-danger">*</span></label>
    <input type="text" name="db_name" class="form-control" value="{{ db.db_name }}"
           placeholder="hacs_{{ studio.slug | replace('-', '_') }}" required>
  </div>
  <div class="col-12 col-sm-6">
    <label class="form-label small fw-semibold">Utente <span class="text-danger">*</span></label>
    <input type="text" name="db_utente" class="form-control" value="{{ db.utente }}"
           placeholder="hacs_user" autocomplete="off" required>
  </div>
  <div class="col-12">
    <label class="form-label small fw-semibold">
      Password
      {% if db.password %}
      <span class="text-muted fw-normal">(lascia vuoto per mantenere quella attuale)</span>
      {% else %}
      <span class="text-danger">*</span>
      {% endif %}
    </label>
    <div class="input-group">
      <input type="password" name="db_password" id="dbPwd_{{ db.mode }}" class="form-control"
             placeholder="{{ '••••••••' if db.password else 'Inserisci password' }}"
             autocomplete="new-password"
             {{ 'required' if not db.password else '' }}>
      <button class="btn btn-outline-secondary" type="button"
              onclick="toggleDbPwd('{{ db.mode }}')" title="Mostra/nascondi">
        <i class="bi bi-eye" id="eyeDbPwd_{{ db.mode }}"></i>
      </button>
    </div>
  </div>
  <div class="col-12 col-sm-4">
    <label class="form-label small fw-semibold">Pool size</label>
    <input type="number" name="pool_size" class="form-control" value="{{ db.pool_size or 5 }}"
           min="1" max="50" title="Numero connessioni nel pool">
  </div>
  <div class="col-12 col-sm-4">
    <label class="form-label small fw-semibold">Timeout (s)</label>
    <input type="number" name="pool_timeout" class="form-control" value="{{ db.pool_timeout or 30 }}"
           min="5" max="300">
  </div>
  <div class="col-12 col-sm-4 d-flex align-items-end">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="ssl" id="sslCheck_{{ db.mode }}"
             {{ 'checked' if db.ssl else '' }}>
      <label class="form-check-label small fw-semibold" for="sslCheck_{{ db.mode }}">
        Usa SSL/TLS
      </label>
    </div>
  </div>
</div>

{% if db.connection_url_safe and db.mode != 'LOCAL' %}
<div class="mt-3 p-2 rounded-2 bg-light border small">
  <span class="text-muted">URL connessione attuale:</span><br>
  <code>{{ db.connection_url_safe }}</code>
</div>
{% endif %}

<script>
function toggleDbPwd(mode) {
  const f = document.getElementById('dbPwd_' + mode);
  const i = document.getElementById('eyeDbPwd_' + mode);
  if (!f) return;
  f.type = f.type === 'password' ? 'text' : 'password';
  i.className = f.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
</script>
