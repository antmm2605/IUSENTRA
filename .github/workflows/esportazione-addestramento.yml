name: Pacchetto di addestramento del catalogo
# Autorizzazione dell'avvocato del 30/10/2026: prepara sul server il pacchetto di addestramento del modello di
# catalogazione (testi pseudonimizzati ed esempi inventati) da copiare sul suo PC via Tailscale. I testi NON passano
# da GitHub: il job stampa solo conteggi e il percorso del pacchetto sul server, copiato (senza le corrispondenze)
# nella cartella dell'utente claude-iusentra, con cui il PC entra nel server via Tailscale.
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HETZNER_HOST: ${{ vars.HETZNER_HOST || '116.203.45.57' }}
  HETZNER_USER: ${{ vars.HETZNER_USER || 'root' }}
jobs:
  esportazione:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Pacchetto pseudonimizzato sul server
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'shred -u ~/.ssh/id_deploy' EXIT
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            'cd /opt/iusentra/repo && docker compose --env-file /opt/iusentra/.env.hetzner -f deploy/hetzner/docker-compose.hetzner.yml exec -T scheduler-worker python -' \
            < deploy/hetzner/esportazione_addestramento.py > uscita.txt
          # Solo la riga del risultato: i log dell'avvio dell'app non escono dal runner.
          grep -m1 '^ESPORTAZIONE_JSON:' uscita.txt | sed 's/^ESPORTAZIONE_JSON://' | jq . > esportazione.json
          rm -f uscita.txt
          jq -e '.studi' esportazione.json > /dev/null
          # Il pacchetto è scritto dal container come root (0600): lo si copia, senza le corrispondenze codice →
          # documento, nella cartella dell'utente con cui il PC dello studio entra nel server.
          for studio in $(jq -r '.studi | to_entries[] | select(.value.righe > 0) | .key' esportazione.json); do
            sorgente=$(jq -r --arg s "$studio" '.studi[$s].cartella_pacchetto | sub("^/data"; "/opt/iusentra/data")' esportazione.json)
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
              "set -euo pipefail; casa=\$(getent passwd claude-iusentra | cut -d: -f6); test -n \"\$casa\"; \
               destinazione=\"\$casa/addestramento_catalogo/pacchetto_${studio}\"; \
               install -d -o claude-iusentra -g claude-iusentra -m 700 \"\$casa/addestramento_catalogo\" \"\$destinazione\"; \
               install -o claude-iusentra -g claude-iusentra -m 600 '${sorgente}/dataset.jsonl.gz' '${sorgente}/prefisso_domanda.txt' '${sorgente}/manifesto.json' \"\$destinazione/\"; \
               echo \"Pacchetto per il PC: \$destinazione\""
          done
          # Solo conteggi e voci pubblicabili: il percorso sul server contiene la cartella dello studio e resta fuori.
          jq -c 'del(.studi[].cartella_pacchetto)' esportazione.json
          {
            echo '## Pacchetto di addestramento del catalogo'
            echo
            jq -r '.studi | to_entries[] | "### \(.key)\n- Righe: \(.value.righe)\n- Per gruppo: \(.value.per_gruppo)\n- Copiato per il PC in addestramento_catalogo/pacchetto_\(.key)\n"' esportazione.json
          } >> "$GITHUB_STEP_SUMMARY"
