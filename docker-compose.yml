# =============================================================================
#  HACS — Studio Legale PCT  |  Docker Compose (versione web integrale)
#
#  Avvio rapido:
#    1. cp .env.example .env          (solo la prima volta)
#    2. docker compose up --build     (prima volta — compila l'immagine)
#    3. docker compose up -d          (volte successive — in background)
#
#  Accesso:
#    http://localhost       → via Nginx (porta 80)  ← consigliato
#    http://localhost:8080  → diretto a Gunicorn      (debug / bypass)
#
#  Credenziali default: admin / admin  (cambia subito dopo il primo accesso!)
#
#  Dati persistenti: cartella ./data/  sul tuo PC
#  Stop:   docker compose down
#  Reset:  docker compose down -v  (ATTENZIONE: cancella tutti i dati!)
# =============================================================================

services:

  # --------------------------------------------------------------------------
  #  App Flask / Gunicorn
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hacs-app
    restart: unless-stopped

    # Porta diretta (utile per debug o ambienti senza nginx)
    ports:
      - "${HACS_PORT:-8080}:8080"

    volumes:
      # Dati persistenti montati dalla cartella ./data/ del progetto
      - ./data:/data

    env_file:
      - .env

    environment:
      # In locale non serve HTTPS forzato (nginx gestisce i redirect)
      PCT_HTTPS: "false"
      # Percorsi dati (ridondanti rispetto al Dockerfile, ma espliciti qui)
      PCT_AGENDA_DB:        /data/agenda/appuntamenti.json
      PCT_CLIENTI_DB:       /data/clienti/anagrafica.json
      PCT_CONDIVISIONI_DB:  /data/clienti/condivisioni.json
      PCT_FASCICOLI_DB:     /data/fascicoli/fascicoli.json
      PCT_FASCICOLI_DOCS:   /data/fascicoli/documenti
      PCT_FASCICOLI_ARCH:   /data/fascicoli/archivio
      PCT_MESSAGGI_DB:      /data/messaggi/storico.json
      PCT_BACKUP_DIR:       /data/backup
      PCT_AUTH_DB:          /data/auth/utenti.json
      PCT_AUDIT_DB:         /data/auth/audit.json
      PCT_SCADENZIARIO_DB:  /data/scadenziario/scadenze.json
      PCT_SEARCH_INDEX:     /data/search/index.db
      PCT_PRIVACY_DB:       /data/privacy/registro.json
      PCT_PORTALE_DB:       /data/portale/portali.json
      PCT_PORTALE_UPLOADS:  /data/portale/uploads
      PCT_FATTURAZIONE_DB:  /data/fatturazione/parcelle.json
      PCT_NOTIFICHE_LOG:    /data/notifiche/log.json
      PCT_TEMPLATE_ATTI_DB: /data/template_atti/templates.json
      PCT_PAGAMENTI_DIR:    /data/pagamenti
      PCT_TENANTS_REGISTRY: /data/tenants.json
      PCT_MULTI_TENANT:     "1"

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # Limiti risorse — adatta alla tua macchina (rimuovi il commento per attivarli)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 768M
    #     reservations:
    #       memory: 256M


  # --------------------------------------------------------------------------
  #  Nginx — reverse proxy, gzip, cache static, SSE support
  #  Attivo di default. Porta 80.
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: hacs-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy

    # Limiti risorse per nginx
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 64M


# =============================================================================
# Volume nominato (alternativa al bind-mount ./data — usa uno o l'altro)
# Per usarlo: cambia  ./data:/data  in  hacs-data:/data  nel servizio app
# e decommenta il blocco qui sotto.
# =============================================================================
# volumes:
#   hacs-data:
#     driver: local
