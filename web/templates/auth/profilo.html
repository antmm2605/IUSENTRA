{% extends "base.html" %}
{% block title %}Profilo — {{ utente.username }}{% endblock %}
{% block page_title %}Il mio profilo{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-xl-7">

<div class="card shadow-sm mb-3">
  <div class="card-header fw-semibold">
    <i class="bi bi-person-circle me-2 text-primary"></i>Dati personali
    <span class="badge bg-{{ 'danger' if utente.ruolo.value == 'AMMINISTRATORE' else ('primary' if utente.ruolo.value == 'AVVOCATO' else 'secondary') }} ms-2">
      {{ utente.ruolo.value }}
    </span>
  </div>
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="azione" value="aggiorna">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control" value="{{ utente.username }}" disabled>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control"
                 value="{{ utente.email }}">
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Nome completo</label>
          <input type="text" name="nome_completo" class="form-control"
                 value="{{ utente.nome_completo }}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Ultimo accesso</label>
          <input type="text" class="form-control"
                 value="{{ utente.ultimo_accesso[:19].replace('T',' ') if utente.ultimo_accesso else '—' }}"
                 disabled>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3">
        <i class="bi bi-check-lg me-1"></i>Salva
      </button>
    </form>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-header fw-semibold">
    <i class="bi bi-lock me-2 text-warning"></i>Cambio password
  </div>
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="azione" value="password">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Password attuale</label>
          <input type="password" name="password_old" class="form-control" required
                 placeholder="••••••••">
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Nuova password</label>
          <input type="password" name="password_new" class="form-control" required
                 minlength="8" placeholder="min. 8 caratteri">
        </div>
      </div>
      <button type="submit" class="btn btn-warning mt-3">
        <i class="bi bi-key me-1"></i>Cambia password
      </button>
    </form>
  </div>
</div>

</div>
</div>
{% endblock %}
