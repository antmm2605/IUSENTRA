name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: ${{ github.workspace }}

jobs:
  quality:
    name: Lint + syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev deps
        run: |
          pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Packaging sync check
        run: |
          python tools/sync_packaging_files.py --check

      - name: Validate Python baseline
        run: |
          python tools/check_python_baseline.py

      - name: Build Python target list
        shell: bash
        run: |
          shopt -s nullglob
          targets=(
            core
            pct
            web
            lex
            tests
            tools/*.py
            worker.py
            gunicorn.conf.py
            vercel_app.py
            visible_signature.py
            wsgi.py
          )
          printf "%s\n" "${targets[@]}" > .python-targets
          cat .python-targets

      - name: Ruff
        shell: bash
        run: |
          python -m ruff check --output-format=github --select E9,F63,F7,F82 $(tr '\n' ' ' < .python-targets)

      - name: Ruff governed modules
        run: |
          python -m ruff check --config pyproject.toml \
            packaging_manifest.py \
            docker/entrypoint.py \
            tools/sync_packaging_files.py \
            pct/giurisprudenza_corpus.py \
            lex/http_bounded_bridge.py \
            lex/context/studio_context.py \
            lex/retrieval \
            lex/formatting/answer_builder.py \
            tests/test_packaging_consistency.py \
            tests/test_docker_entrypoint.py

      - name: Mypy governed modules
        run: |
          python -m mypy --platform linux packaging_manifest.py docker/entrypoint.py tools/sync_packaging_files.py

      - name: Flake8
        shell: bash
        run: |
          python -m flake8 $(tr '\n' ' ' < .python-targets)

      - name: Compile package dirs
        run: |
          python - <<'PY'
          import compileall
          import sys
          from pathlib import Path

          directories = [Path("pct"), Path("web"), Path("lex"), Path("tests")]
          ok = True
          for directory in directories:
            if directory.exists():
              ok = compileall.compile_dir(str(directory), quiet=1) and ok
          sys.exit(0 if ok else 1)
          PY

      - name: Compile standalone Python files
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path

          paths = []
          paths.extend(sorted(Path("tools").glob("*.py")))
          for filename in ("worker.py", "gunicorn.conf.py", "vercel_app.py", "visible_signature.py", "wsgi.py"):
            path = Path(filename)
            if path.exists():
              paths.append(path)

          for path in paths:
            py_compile.compile(str(path), doraise=True)
            print(f"Compiled {path}")
          PY

      - name: Gate anti-regressione CI 100%
        run: |
          python -m pytest -q tests/test_ci_no_regression_contract.py \
            --cov=tests.test_ci_no_regression_contract \
            --cov-report=term-missing \
            --cov-fail-under=100

  governance:
    name: Governance repo
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check modularizzazione e guardrail repo
        run: |
          python tools/check_repo_governance.py

  smoke-flask:
    name: Smoke test Flask
    runs-on: ubuntu-latest
    needs:
      - quality
      - governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev deps
        run: |
          pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Import production entry point
        run: |
          python - <<'PY'
          import vercel_app
          from web.app import create_app

          app = vercel_app.app
          direct_app = create_app({"TESTING": True})
          client = app.test_client()
          direct_client = direct_app.test_client()

          home = client.get("/", follow_redirects=False)
          login = client.get("/login", follow_redirects=False)
          direct_login = direct_client.get("/login", follow_redirects=False)
          assert home.status_code < 500, f"Unexpected home status: {home.status_code}"
          assert login.status_code == 200, f"Unexpected login status: {login.status_code}"
          assert direct_login.status_code == 200, f"Unexpected create_app login status: {direct_login.status_code}"
          assert "PCT_SCHEDULER" not in direct_app.config, "create_app() non deve avviare lo scheduler web"

          print("Smoke OK:", home.status_code, login.status_code, direct_login.status_code)
          PY

  smoke-scheduler-worker:
    name: Smoke scheduler worker
    runs-on: ubuntu-latest
    needs:
      - quality
      - governance
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev deps
        run: |
          pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Start scheduler worker entry point
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          from pct.scheduler_worker import start_scheduler_worker

          tmp_root = Path(tempfile.mkdtemp(prefix="hacs-scheduler-smoke-"))
          studio_cfg = tmp_root / "config" / "studio.json"
          studio_cfg.parent.mkdir(parents=True, exist_ok=True)
          studio_cfg.write_text(
              json.dumps(
                  {
                      "studio": {"nome": "Studio Scheduler"},
                      "scheduler": {"backup_ora": "03:30", "wa_reminder_ora": "17:15"},
                  },
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          cfg = {
              "TESTING": True,
              "SECRET_KEY": "test-secret-key-for-scheduler-worker",
              "AUTH_DB": str(tmp_root / "auth" / "utenti.json"),
              "AUDIT_DB": str(tmp_root / "auth" / "audit.json"),
              "BOOTSTRAP_ADMIN_PASSWORD": "admin",
              "BOOTSTRAP_ADMIN_CREDENTIALS_PATH": str(tmp_root / "auth" / "bootstrap_admin.json"),
              "CLIENTI_DB": str(tmp_root / "clienti" / "anagrafica.json"),
              "CONDIVISIONI_DB": str(tmp_root / "clienti" / "condivisioni.json"),
              "FASCICOLI_DB": str(tmp_root / "fascicoli" / "fascicoli.json"),
              "FASCICOLI_DOCS": str(tmp_root / "fascicoli" / "documenti"),
              "FASCICOLI_ARCH": str(tmp_root / "fascicoli" / "archivio"),
              "AGENDA_DB": str(tmp_root / "agenda" / "appuntamenti.json"),
              "SCADENZIARIO_DB": str(tmp_root / "scadenziario" / "scadenze.json"),
              "MESSAGGI_DB": str(tmp_root / "messaggi" / "storico.json"),
              "EMAIL_CASELLA_DB": str(tmp_root / "email" / "casella.json"),
              "SEARCH_INDEX": str(tmp_root / "search" / "index.db"),
              "SOGGETTI_DB": str(tmp_root / "soggetti" / "anagrafica.json"),
              "SOGGETTI_PARTI_DB": str(tmp_root / "soggetti" / "parti.json"),
              "LEGAL_INTELLIGENCE_DB": str(tmp_root / "intelligence" / "motori.json"),
              "NORMATIVE_TABLES_DB": str(tmp_root / "intelligence" / "tabelle_normative.json"),
              "GIURISPRUDENZA_DB": str(tmp_root / "intelligence" / "giurisprudenza.json"),
              "WORKSPACE_INTELLIGENCE_DB": str(tmp_root / "intelligence" / "workspace_intelligence.json"),
              "VALIDATION_RUNS_DB": str(tmp_root / "intelligence" / "validation_runs.json"),
              "LOCAL_AI_DB": str(tmp_root / "intelligence" / "local_ai.db"),
              "LOCAL_AI_MODELS_DIR": str(tmp_root / "intelligence" / "models"),
              "LOCAL_AI_POLICY": str(Path("config") / "ai-policy.json"),
              "TEMPLATE_ATTI_DB": str(tmp_root / "template_atti" / "templates.json"),
              "TEMPLATE_ATTI_PREFS_DB": str(tmp_root / "template_atti" / "editor_layout.json"),
              "PREVENTIVI_DB": str(tmp_root / "preventivi" / "preventivi.json"),
              "FATTURAZIONE_DB": str(tmp_root / "fatturazione" / "parcelle.json"),
              "STUDIO_CONFIG": str(studio_cfg),
              "PORTALE_DB": str(tmp_root / "portale" / "portali.json"),
              "PORTALE_UPLOADS": str(tmp_root / "portale" / "uploads"),
              "TENANTS_REGISTRY": str(tmp_root / "tenants.json"),
              "PDP_PENALE_DB": str(tmp_root / "penale" / "pdp_penale.db"),
              "TELEMATICO_DB": str(tmp_root / "telematico" / "workflow.db"),
          }

          os.environ.pop("PCT_DISABLE_SCHEDULER", None)
          os.environ.pop("PCT_SCHEDULER_RUNNING", None)
          app = start_scheduler_worker(cfg)
          scheduler = app.config.get("PCT_SCHEDULER")
          assert scheduler is not None, "Worker scheduler non avviato"
          assert scheduler.get_job("backup_giornaliero") is not None
          assert scheduler.get_job("local_ai_maintenance") is not None
          scheduler.shutdown(wait=False)
          os.environ.pop("PCT_SCHEDULER_RUNNING", None)
          print("Scheduler worker OK")
          PY

