<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — IUSENTRA</title>
  <style>
    :root { --primary: #1a3a5c; --accent: #c8972b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--primary);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 400px;
      width: 100%;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .75rem;
      color: var(--accent);
    }
    p {
      font-size: .95rem;
      opacity: .8;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: .75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .85; }
    .hint {
      margin-top: 1.5rem;
      font-size: .78rem;
      opacity: .45;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📡</span>
    <h1>Nessuna connessione</h1>
    <p>
      Non riesci a raggiungere il server PCT.<br>
      Controlla la connessione Internet e riprova.
    </p>
    <button class="btn" onclick="location.reload()">
      Riprova
    </button>
    <p class="hint">
      I dati già aperti sono disponibili nella cache del browser.
    </p>
  </div>
  <script>
    // Ricarica automaticamente quando torna la connessione
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
