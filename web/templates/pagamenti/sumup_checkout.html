<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento SumUp — {{ studio_nome }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .pay-card { max-width: 520px; width: 100%; border-radius: 1.25rem; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
    .su-header { background: linear-gradient(135deg, #1b1f3b 0%, #3d4472 100%); color: #fff; border-radius: 1.25rem 1.25rem 0 0; padding: 1.5rem 2rem; }
    #sumup-widget { min-height: 400px; }
  </style>
</head>
<body>
  <div class="pay-card card border-0">
    <div class="su-header">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-wallet2 fs-4"></i>
        <div>
          <div class="fw-600">{{ studio_nome }}</div>
          <div style="font-size:1.4rem;font-weight:700;">€ {{ "%.2f"|format(lp.importo) }}</div>
        </div>
      </div>
    </div>

    <div class="card-body p-3 p-md-4">
      <!-- SumUp Checkout Widget -->
      <div id="sumup-widget"></div>

      <div class="text-center mt-3">
        <a href="{{ url_for('pagamenti.checkout', token=lp.token) }}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Torna indietro
        </a>
      </div>

      <div class="text-center mt-2">
        <small class="text-muted"><i class="bi bi-shield-lock me-1"></i>Pagamento sicuro via SumUp</small>
      </div>
    </div>
  </div>

  <!-- SumUp Web SDK -->
  <script src="https://gateway.sumup.com/gateway/ecom/card/v2/sdk.js"></script>
  <script>
    SumUpCard.mount({
      id:          'sumup-widget',
      checkoutId:  '{{ checkout_id }}',
      onResponse: function(type, body) {
        if (type === 'success') {
          window.location.href = '{{ success_url }}?provider=sumup';
        } else if (type === 'error') {
          document.getElementById('sumup-widget').innerHTML =
            '<div class="alert alert-danger mt-2"><i class="bi bi-exclamation-triangle me-2"></i>Pagamento non riuscito. Riprova o scegli un altro metodo.</div>';
        }
      },
      onLoad: function() {
        // SDK loaded
      }
    });
  </script>
</body>
</html>
