name: CI Required Gates

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [codex-ci-recovery]

permissions:
  actions: read
  checks: read
  contents: read
  statuses: read

concurrency:
  group: ci-required-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  current-sha-gates:
    name: CI reale eseguita sul commit corrente
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Verifica check GitHub dello SHA corrente
        env:
          GH_TOKEN: ${{ github.token }}
          # In contesto pull_request GITHUB_SHA è il merge commit sintetico, su cui
          # nessun workflow viene eseguito: i check reali vivono sullo SHA di testa
          # della PR. Senza questo, il gate falliva sempre dopo il timeout (0/85)
          # e l'istanza rossa bloccava il push del sync verso il branch protetto.
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/ci
          python tools/check_github_required_gates.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${TARGET_SHA}" \
            --event "${GITHUB_EVENT_NAME}" \
            --wait \
            --timeout-seconds 5400 \
            --poll-seconds 30 \
            --report-md artifacts/ci/current-sha-required-gates.md \
            --report-json artifacts/ci/current-sha-required-gates.json

      - name: Upload report CI richiesti
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: current-sha-required-gates
          path: artifacts/ci/current-sha-required-gates.*
          if-no-files-found: warn
          retention-days: 14
