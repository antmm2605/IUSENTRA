name: Sync Claude To Codex

on:
  push:
    branches:
      - "claude/legal-electronic-filing-kIxcV"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-codex-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mirror Claude branch into Codex branch
        run: |
          git push origin HEAD:refs/heads/Codex/legal-electronic-filing-kIxcV --force
