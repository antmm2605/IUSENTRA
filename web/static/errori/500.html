<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Errore del server - IUSENTRA</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <!-- Pagina autonoma: niente Jinja, niente bundle React, niente script. Deve apparire anche se il resto è guasto. -->
  <style>
    :root { --fondo: #f4f6fa; --testo: #1a2744; --tenue: #475569; --bordo: #d9dee8; --accento: #1a2744; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--testo); }
    main { width: 100%; max-width: 520px; padding: 32px 28px; background: #fff; border: 1px solid var(--bordo); border-radius: 16px; }
    .codice { margin: 0 0 6px; color: #b91c1c; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.2; }
    p { margin: 0 0 20px; color: var(--tenue); font-size: 15px; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; font-weight: 700; text-decoration: none; }
    .primario { background: var(--accento); color: #fff; }
    .secondario { border: 1px solid var(--bordo); color: var(--testo); }
    a:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="codice">Errore 500</p>
    <h1>Errore interno del server</h1>
    <p>Si è verificato un errore imprevisto e l’operazione non è stata completata. Il dettaglio tecnico è stato registrato. Riprova tra qualche istante: i dati dello studio non sono stati modificati da questa pagina.</p>
    <nav aria-label="Dove andare">
      <a class="primario" href="">Riprova</a>
      <a class="secondario" href="/">Torna alla panoramica</a>
    </nav>
  </main>
</body>
</html>
