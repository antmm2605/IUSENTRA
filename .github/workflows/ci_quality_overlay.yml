name: CI Quality Overlay

on:
  workflow_dispatch:
  repository_dispatch:
    types: [codex-ci-recovery]
  pull_request:
  push:
    branches:
      - "**"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install runtime dependencies
        run: pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev dependencies
        run: pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Governance
        run: python tools/check_repo_governance.py

      - name: Packaging sync
        run: python tools/sync_packaging_files.py --check

      - name: Python baseline
        run: python tools/check_python_baseline.py

      - name: Local Signer boundaries
        run: python tools/check_local_signer_boundaries.py

      - name: Lex quality gates
        run: python tools/check_lex_quality_gates.py

      - name: Performance budget
        run: python tools/check_performance_budget.py

  targeted-tests:
    name: Targeted tests parte ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: quality-gates
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip wheel setuptools

      - name: Install runtime dependencies
        run: pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev dependencies
        run: pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Run targeted shard
        run: python scripts/run_pytest_phases.py --suite quality-overlay --suite-shard ${{ matrix.shard }} --suite-total-shards 3 --timeout-minutes 5

  targeted-tests-summary:
    name: Targeted tests
    runs-on: ubuntu-latest
    needs: targeted-tests
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check targeted shards
        run: |
          if [ "${{ needs['targeted-tests'].result }}" != "success" ]; then
            echo "Uno o piu' shard dei targeted tests non sono verdi."
            exit 1
          fi
          echo "Tutti i targeted tests sono verdi."
