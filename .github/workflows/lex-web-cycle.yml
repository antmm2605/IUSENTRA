# =============================================================================
#  Lex — ciclo di apprendimento autonomo in modalità WEB (prova governata).
#
#  Esegue il ciclo `lex.autonomy` DENTRO il container di produzione
#  `iusentra-app` sul server Hetzner (che raggiunge le fonti ufficiali, a
#  differenza degli ambienti di sviluppo), SENZA toccare produzione:
#  memoria solo in /tmp del container, /data mai coinvolto, pulizia finale.
#
#  Due fasi:
#    1. ciclo web puro (ricerca governata via official_web + PoliteFetcher);
#       exit 2 = "nessuna fonte trovata dalla ricerca" è un esito valido da
#       riportare (i motori di ricerca possono bloccare IP datacenter);
#    2. lettura diretta di fonti seminate REALI utili allo studio
#       (Normattiva, Gazzetta Ufficiale, Cassazione, Consulta, G.A., EUR-Lex,
#       Garante, Agenzia Entrate, INPS): prova fetch reale, robots.txt,
#       rate-limit, trust ed estrazione, qualunque cosa faccia la fase 1.
#
#  Avvio: manuale (workflow_dispatch) oppure automatico UNA volta quando questo
#  stesso file cambia sul branch di sviluppo (push con filtro paths) — serve da
#  auto-verifica del workflow, dato che il token dell'integrazione non ha il
#  permesso actions:write per il dispatch via API. Nessuna pianificazione.
#  Riusa i secrets del deploy: HETZNER_SSH_PRIVATE_KEY, HETZNER_SSH_KNOWN_HOSTS.
# =============================================================================
name: Lex ciclo web

on:
  push:
    branches:
      - claude/legal-electronic-filing-kIxcV
    paths:
      - .github/workflows/lex-web-cycle.yml
  workflow_dispatch:
    inputs:
      max_queries:
        description: Numero massimo di query di ricerca (tetto rigido 50)
        type: string
        default: "20"
      max_sources:
        description: Numero massimo di fonti lette (tetto rigido 40)
        type: string
        default: "10"
      dry_run:
        description: Esegue senza scrivere la memoria (solo fase 1, nessun artifact)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lex-web-cycle
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HETZNER_HOST: ${{ vars.HETZNER_HOST || '116.203.45.57' }}
  HETZNER_USER: ${{ vars.HETZNER_USER || 'root' }}
  LEX_CONTAINER: iusentra-app
  REMOTE_DIR: /tmp/lex-web-cycle-${{ github.run_id }}
  CONTAINER_DIR: /tmp/lex-web-cycle

jobs:
  web-cycle:
    name: Ciclo web governato su Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Verifica secrets obbligatori
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "${HETZNER_SSH_PRIVATE_KEY:-}" ]; then missing+=("HETZNER_SSH_PRIVATE_KEY"); fi
          if [ -z "${HETZNER_SSH_KNOWN_HOSTS:-}" ]; then missing+=("HETZNER_SSH_KNOWN_HOSTS"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets mancanti: ${missing[*]}. Vedere docs/DEPLOY_HETZNER_CPX42.md."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup chiave SSH e known_hosts
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$HETZNER_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_deploy >/dev/null
          echo "Chiave SSH e known_hosts pronti."

      - name: Verifica server e container
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${HETZNER_USER}@${HETZNER_HOST}" \
              "docker ps --filter name=${LEX_CONTAINER} --format '{{.Names}} {{.Status}}' | grep -q '${LEX_CONTAINER}'" \
            || { echo "::error::Container ${LEX_CONTAINER} non in esecuzione sul server."; exit 1; }
          echo "Container ${LEX_CONTAINER} attivo."

      - name: Attendi il deploy di questo commit (solo su push)
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          # Sulla run auto-innescata dal push, il CONTAINER deve girare il
          # codice di questo commit. Lezione della run #3: controllare il
          # checkout del repo non basta (avviene PRIMA del rebuild e la fase 2
          # e' stata uccisa con exit 137 dal restart del container). Segnale
          # corretto: la versione dentro il container IN ESECUZIONE deve
          # coincidere con quella del commit; poi 30s di assestamento.
          expected=$(grep -oP '__version__ = "\K[^"]+' pct/__init__.py)
          echo "Versione attesa nel container: ${expected}"
          for tentativo in $(seq 1 50); do
            in_container=$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                "${HETZNER_USER}@${HETZNER_HOST}" \
                "docker exec '${LEX_CONTAINER}' python -c 'import pct; print(pct.__version__)' 2>/dev/null || true")
            if [ "${in_container}" = "${expected}" ]; then
              echo "Container aggiornato a ${expected} dopo ${tentativo} controlli: attendo 30s di assestamento."
              sleep 30
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Il container gira ancora la versione ${in_container:-n/d} (attesa ${expected}): la run verifica il codice attualmente deployato."

      - name: Prepara payload (config con override input, campioni, script semina)
        run: |
          set -euo pipefail
          mkdir -p payload
          # Su push il contesto inputs è vuoto: valgono i default (20/10).
          jq --argjson mq "${{ inputs.max_queries || '20' }}" --argjson ms "${{ inputs.max_sources || '10' }}" \
             '.limits.max_queries = $mq | .limits.max_sources = $ms' \
             examples/lex_autonomous_config_web.json > payload/config.json
          cp examples/legal_samples.json payload/samples.json
          cat > payload/fase2_semina.py <<'PYEOF'
          """Fase 2 — lettura diretta di fonti ufficiali REALI utili allo studio.

          Usa la libreria lex.autonomy dentro il container: trust fail-closed,
          PoliteFetcher (robots + rate-limit), estrazione citazioni/termini,
          memoria JSONL e grafo. Nessuna scrittura fuori da /tmp/lex-web-cycle.
          """
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          from lex.autonomy.improvement_proposer import propose_improvements
          from lex.autonomy.safety import validate_cycle_config
          from lex.autonomy.source_reader import read_source
          from lex.knowledge.concept_graph import ConceptGraph, node_id
          from lex.knowledge.knowledge_base import KnowledgeBase
          from lex.sources.models import SourceCandidate
          from lex.sources.polite_fetcher import PoliteFetcher
          from lex.sources.trust import assess_source

          BASE = Path("/tmp/lex-web-cycle")
          # URL "!vig=" = versione vigente del SINGOLO articolo (l'URN nudo
          # restituisce l'intero codice > 2MB, scartato dal tetto byte nella
          # run #1). Le pagine giurisprudenza_*.page di Cassazione sono le
          # liste reali gia' crawlate in produzione dal motore aggiornamenti
          # (pct/legal_update_source_parsers.py, CASSAZIONE_LATEST_CATEGORY_MARKERS);
          # dcsnprr e' la pagina "Decisioni e pareri" G.A. censita in
          # pct/legal_update_pipeline.py (canale HTML instabile per i crawler:
          # esito vuoto o bloccato = esito valido, il presidio resta OpenGA).
          SEEDS = [
              ("https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:regio.decreto:1942-03-16;262~art2043!vig=", "civile", "Art. 2043 c.c. (vigente) — Normattiva"),
              ("https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:1990-08-07;241", "amministrativo", "L. 241/1990 — Normattiva"),
              ("https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.legislativo:2022-10-10;149", "civile", "D.Lgs. 149/2022 (riforma Cartabia) — Normattiva"),
              ("https://www.gazzettaufficiale.it/30giorni/serie_generale", "civile", "Gazzetta Ufficiale — ultime pubblicazioni serie generale"),
              ("https://www.cortedicassazione.it/it/giurisprudenza_civile.page", "civile", "Cassazione — giurisprudenza civile (lista sentenze)"),
              ("https://www.cortedicassazione.it/it/giurisprudenza_penale.page", "penale", "Cassazione — giurisprudenza penale (lista sentenze)"),
              ("https://www.cortecostituzionale.it/", "civile", "Corte costituzionale — pronunce"),
              ("https://www.giustizia-amministrativa.it/", "amministrativo", "Giustizia amministrativa — decisioni"),
              ("https://www.giustizia-amministrativa.it/dcsnprr", "amministrativo", "Giustizia amministrativa — Decisioni e pareri"),
              ("https://eur-lex.europa.eu/legal-content/IT/TXT/?uri=CELEX:32016R0679", "privacy", "Regolamento (UE) 2016/679 — EUR-Lex"),
              ("https://www.garanteprivacy.it/", "privacy", "Garante Privacy — provvedimenti"),
              ("https://www.agenziaentrate.gov.it/portale/", "tributario", "Agenzia delle Entrate — prassi"),
              ("https://www.inps.it/", "lavoro", "INPS — circolari e messaggi"),
          ]

          # Drill-down dettagli: dalle LISTE ufficiali ai testi dei singoli
          # provvedimenti (Cassazione, Consulta, G.A.). Le regole vivono nella
          # libreria — lex/autonomy/detail_links.py — e rispecchiano i pattern
          # di produzione (test di allineamento dedicato).
          from lex.autonomy.detail_links import extract_detail_links, rule_for

          DETTAGLI_PER_LISTA = 2

          config = validate_cycle_config(json.loads((BASE / "config.json").read_text(encoding="utf-8")))
          kb = KnowledgeBase(BASE / "memoria")
          graph = ConceptGraph.load(Path(kb.memory_dir) / "concept_graph.json")
          fetcher = PoliteFetcher(
              min_interval_seconds=config.min_interval_seconds,
              timeout_seconds=config.timeout_seconds,
              max_bytes=config.max_bytes,
              respect_robots=config.respect_robots,
          )
          esiti = []
          dettagli_sentenze = []

          def leggi_e_impara(url, area, titolo, *, discovered_by, tipo, contenuto_inline=""):
              assessment = assess_source(
                  url,
                  area=area,
                  mode=config.source_mode,
                  require_official=config.require_official_sources,
                  allowlist=config.allowlist,
                  denylist=config.denylist,
              )
              kb.append("trust_assessments", assessment.stable_id(), assessment.to_dict())
              if not assessment.allowed_for_learning:
                  esiti.append({"url": url, "area": area, "tipo": tipo, "esito": "respinta_policy", "motivi": assessment.reasons[:2]})
                  return
              candidate = SourceCandidate(
                  url=url, title=titolo, source_id=assessment.source_id,
                  discovered_by=discovered_by, query="fase2", content=contenuto_inline,
              )
              adesso = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
              reading, citations, terms = read_source(candidate, area=area, fetcher=fetcher, iso_now=adesso)
              kb.append("source_readings", reading.stable_id(), reading.to_dict())
              for citation in citations:
                  kb.append("citations", citation.stable_id(), {**citation.to_dict(), "area": area})
                  graph.ensure_node("norma", citation.normalized_text, area=area, seen_at=adesso)
              for term in terms:
                  kb.append("legal_terms", term.stable_id(), term.to_dict())
                  graph.ensure_node("concetto", term.normalized, area=term.area, seen_at=adesso)
              if reading.status == "ok" and citations:
                  dominio = url.split("/")[2]
                  graph.ensure_node("fonte", dominio, seen_at=adesso)
                  for citation in citations[:20]:
                      graph.add_edge(node_id("fonte", dominio), node_id("norma", citation.normalized_text), "letta_per")
              esiti.append({
                  "url": url,
                  "area": area,
                  "tipo": tipo,
                  "esito": reading.status,
                  "caratteri": reading.text_characters,
                  "citazioni": len(citations),
                  "termini": len(terms),
                  "avvisi": reading.warnings[:1],
              })

          for url, area, titolo in SEEDS:
              contenuto_inline = ""
              regola = rule_for(url)
              if regola is not None:
                  # Un solo fetch della lista: testo per la lettura + href dei
                  # dettagli da approfondire (max DETTAGLI_PER_LISTA per lista).
                  raw = fetcher.fetch(url)
                  if raw.status == "ok" and raw.content:
                      from lex.sources.extractors import extract_text_from_bytes

                      contenuto_inline = extract_text_from_bytes(raw.content, raw.content_type, filename=url)
                      html = raw.content.decode("utf-8", errors="ignore")
                      for dettaglio in extract_detail_links(url, html, limit=DETTAGLI_PER_LISTA):
                          dettagli_sentenze.append((dettaglio, area, regola.detail_label))
              leggi_e_impara(url, area, titolo, discovered_by="semina", tipo="seed", contenuto_inline=contenuto_inline)

          visti = set()
          for url, area, etichetta in dettagli_sentenze:
              if url.casefold() in visti:
                  continue
              visti.add(url.casefold())
              leggi_e_impara(url, area, etichetta, discovered_by="semina_dettaglio", tipo="dettaglio_sentenza")

          for proposal in propose_improvements(kb):
              kb.append("improvement_proposals", proposal.stable_id(), proposal.to_dict())
          graph.save(Path(kb.memory_dir) / "concept_graph.json")
          print(json.dumps({"fase": "semina_fonti_reali", "dettagli_sentenze_trovati": len(dettagli_sentenze), "esiti": esiti, "memoria": kb.snapshot_counts()}, ensure_ascii=False, indent=2))
          PYEOF
          echo "Payload pronto:" && ls -la payload/

      - name: Copia payload nel container
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${HETZNER_USER}@${HETZNER_HOST}" "mkdir -p '${REMOTE_DIR}'"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              payload/config.json payload/samples.json payload/fase2_semina.py \
              "${HETZNER_USER}@${HETZNER_HOST}:${REMOTE_DIR}/"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${HETZNER_USER}@${HETZNER_HOST}" \
              "docker exec '${LEX_CONTAINER}' mkdir -p '${CONTAINER_DIR}' \
               && docker cp '${REMOTE_DIR}/config.json' '${LEX_CONTAINER}:${CONTAINER_DIR}/config.json' \
               && docker cp '${REMOTE_DIR}/samples.json' '${LEX_CONTAINER}:${CONTAINER_DIR}/samples.json' \
               && docker cp '${REMOTE_DIR}/fase2_semina.py' '${LEX_CONTAINER}:${CONTAINER_DIR}/fase2_semina.py'"

      - name: Fase 1 — ciclo web puro (ricerca governata)
        id: fase1
        run: |
          set -euo pipefail
          dry_flag=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then dry_flag=",'--dry-run'"; fi
          esegui_ciclo() {
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=30 \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                "${HETZNER_USER}@${HETZNER_HOST}" \
                "docker exec '${LEX_CONTAINER}' python -c \"from lex.autonomy.cli import main; import sys; sys.exit(main(['--config','${CONTAINER_DIR}/config.json','--samples','${CONTAINER_DIR}/samples.json','--memory-dir','${CONTAINER_DIR}/memoria','--report','text'${dry_flag}]))\""
          }
          set +e
          esegui_ciclo
          rc=$?
          if [ "${rc}" = "137" ]; then
            # 137 = docker exec ucciso da un restart del container (deploy
            # concorrente): 60s di attesa e un solo retry.
            echo "::warning::Fase 1 interrotta dal riavvio del container (exit 137): retry tra 60s."
            sleep 60
            esegui_ciclo
            rc=$?
          fi
          set -e
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          case "${rc}" in
            0) echo "Fase 1 completata: ciclo web con fonti trovate." ;;
            2) echo "::warning::Fase 1: nessuna fonte trovata dalla ricerca web (exit 2) — esito valido, la fase 2 prova comunque la lettura reale." ;;
            *) echo "::error::Fase 1 fallita con exit ${rc} (1=config, 3=ciclo)."; exit "${rc}" ;;
          esac

      - name: Fase 2 — lettura diretta fonti reali seminate
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          esegui_semina() {
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
                -o ServerAliveInterval=30 -o ServerAliveCountMax=30 \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                "${HETZNER_USER}@${HETZNER_HOST}" \
                "docker exec '${LEX_CONTAINER}' python '${CONTAINER_DIR}/fase2_semina.py'"
          }
          set +e
          esegui_semina
          rc=$?
          if [ "${rc}" = "137" ]; then
            echo "::warning::Fase 2 interrotta dal riavvio del container (exit 137): retry tra 60s."
            sleep 60
            esegui_semina
            rc=$?
          fi
          set -e
          exit "${rc}"

      - name: Riepilogo memoria nel log
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${HETZNER_USER}@${HETZNER_HOST}" \
              "docker exec '${LEX_CONTAINER}' sh -c 'cd ${CONTAINER_DIR}/memoria 2>/dev/null || exit 0; \
                 echo \"===== candidati da archivio_locale =====\"; grep -c archivio_locale source_profiles.jsonl 2>/dev/null || echo 0; \
                 for f in source_readings trust_assessments citations improvement_proposals research_questions; do \
                   echo \"===== \$f =====\"; wc -l < \$f.jsonl 2>/dev/null || echo 0; head -c 4000 \$f.jsonl 2>/dev/null; echo; \
                 done'"

      - name: Esporta memoria come artifact
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${HETZNER_USER}@${HETZNER_HOST}" \
              "docker exec '${LEX_CONTAINER}' sh -c 'cd ${CONTAINER_DIR} && tar czf - memoria 2>/dev/null'" \
              > lex-web-cycle-memoria.tgz
          ls -la lex-web-cycle-memoria.tgz

      - name: Upload artifact memoria
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v5
        with:
          name: lex-web-cycle-memoria
          path: lex-web-cycle-memoria.tgz
          retention-days: 14

      - name: Pulizia (container e host, sempre)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${HETZNER_USER}@${HETZNER_HOST}" \
              "docker exec '${LEX_CONTAINER}' rm -rf '${CONTAINER_DIR}' 2>/dev/null; rm -rf '${REMOTE_DIR}'" || true
          echo "Pulizia completata: nessun residuo su container o host."
