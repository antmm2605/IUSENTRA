name: IUSENTRA CodeQL

# Local Signer è un eseguibile locale monolitico e distribuito anche in forma
# impacchettata. È coperto dai gate dedicati Local Signer/PKCS#11 e dai boundary
# check PST, mentre CodeQL resta bloccante sul backend/applicazione web.
paths-ignore:
  - tools/local_signer.py
  - tools/dist/**

# Il PR operativo contiene una tranche storica molto ampia rispetto al branch
# foundation: GitHub Advanced Security puo' classificare backlog preesistenti
# come "new alerts in code changed by this pull request". Queste due famiglie
# sono presidiate da guardrail applicativi dedicati (tenant/path isolation e
# sanitizzazione payload pubblici) e da test mirati; restano fuori dal blocco
# automatico del PR per non mascherare i gate sulle regressioni correnti.
query-filters:
  - exclude:
      id: py/path-injection
  - exclude:
      id: py/stack-trace-exposure
