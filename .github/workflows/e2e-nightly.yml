name: E2E Nightly

on:
  schedule:
    # GitHub Actions usa UTC: 01:15 UTC = notte italiana (03:15 CEST / 02:15 CET)
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  e2e-full:
    name: E2E full suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install dev deps
        run: |
          pip install -r requirements-dev.txt

      - name: Run complete E2E suite
        run: |
          pytest -q \
            tests/e2e/test_studio_reale_flow.py \
            tests/e2e/test_ai_pipeline_full.py \
            tests/e2e/test_tenant_migration_full.py \
            tests/e2e/test_operational_crash_day.py
