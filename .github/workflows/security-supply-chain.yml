name: Security Supply Chain

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 2"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit dipendenze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt -r requirements-dev.txt
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14

  npm-audit:
    name: Audit dipendenze frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm --filter @iusentra/studio audit --audit-level=critical --prod --json > frontend-pnpm-audit.json

      - name: Upload pnpm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-pnpm-audit-report
          path: frontend-pnpm-audit.json
          if-no-files-found: warn
          retention-days: 14

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sbom
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .

      - name: Upload sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
