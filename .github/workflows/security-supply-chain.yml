name: Security Supply Chain

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [codex-ci-recovery]
  schedule:
    - cron: "45 3 * * 2"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  pip-audit:
    name: Audit dipendenze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints.txt -r requirements-dev.txt
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 14

  npm-audit:
    name: Audit dipendenze frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm --filter @iusentra/studio audit --audit-level=critical --prod --json > frontend-pnpm-audit.json

      - name: Upload pnpm audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-pnpm-audit-report
          path: frontend-pnpm-audit.json
          if-no-files-found: warn
          retention-days: 14

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Syft
        run: |
          set -euo pipefail
          version="1.42.3"
          asset="syft_${version}_linux_amd64.tar.gz"
          base_url="https://github.com/anchore/syft/releases/download/v${version}"
          for attempt in 1 2 3 4 5; do
            curl -fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 \
              --output "${asset}" "${base_url}/${asset}" \
            && curl -fL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 \
              --output syft_checksums.txt "${base_url}/syft_${version}_checksums.txt" \
            && break
            if [ "$attempt" = "5" ]; then
              echo "Download Syft non riuscito dopo ${attempt} tentativi." >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          grep " ${asset}$" syft_checksums.txt | sha256sum -c -
          tar -xzf "${asset}" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Build sbom
        run: syft dir:. -o spdx-json=sbom.spdx.json

      - name: Upload sbom
        uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.spdx.json
