name: Security Supply Chain

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * 2"

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit dipendenze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build sbom
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          path: .

      - name: Upload sbom
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
