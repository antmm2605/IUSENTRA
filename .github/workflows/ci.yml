          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev deps
        run: |
          pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Run E2E smoke
        run: |
          # Target storico incluso dal runner:
          # tests/e2e/test_studio_reale_flow.py
          python scripts/run_pytest_phases.py \
            --suite e2e-smoke \
            --timeout-minutes 5

  signer-shards:
    name: Local Signer e PKCS#11 (${{ matrix.os }}) parte ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    needs:
      - quality
      - governance
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -c requirements/constraints.txt -r requirements.txt

      - name: Install dev deps
        run: |
          pip install -c requirements/constraints.txt -r requirements-dev.txt

      - name: Run signer cross-platform shard
        run: |
          python scripts/run_pytest_phases.py --suite signer --suite-shard ${{ matrix.shard }} --suite-total-shards 4 --suite-subdivide-items --timeout-minutes 5

  signer-matrix:
    name: Local Signer e PKCS#11
    runs-on: ubuntu-latest
    needs:
      - signer-shards
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check signer shards
        run: |
          if [ "${{ needs['signer-shards'].result }}" != "success" ]; then
            echo "Uno o piu' shard Local Signer non sono verdi."
            exit 1
          fi
          echo "Tutti gli shard Local Signer sono verdi."
