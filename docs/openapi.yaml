          - POST
          - PUT
          - PATCH
          - DELETE
        enabled:
          type: boolean
      additionalProperties: true
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
      additionalProperties: true
    MutationRequest:
      type: object
      description: Payload JSON di scrittura. Sono vietati tenant_id/studio_id/user_id/token/redirect generici.
      additionalProperties: true
      not:
        anyOf:
        - required:
          - tenant_id
        - required:
          - studio_id
        - required:
          - user_id
        - required:
          - token
        - required:
          - api_key
        - required:
          - redirect
        - required:
          - return_url
    DocumentUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        filename:
          type: string
        metadata:
          $ref: '#/components/schemas/DomainRecord'
      required:
      - file
      additionalProperties: true
    ErrorResponse:
      type: object
      description: Errore API normalizzato. I campi `errore`/`codice` restano documentati per compatibilita legacy.
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
          example: forbidden
        errore:
          type: string
          example: Operazione non consentita.
        message:
          type: string
          example: Operazione non consentita.
        code:
          type: string
          example: forbidden
        codice:
          oneOf:
          - type: string
          - type: integer
          example: 403
        request_id:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
        errors:
          type: object
          additionalProperties: true
        violations:
          type: array
          items:
