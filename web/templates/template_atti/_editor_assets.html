<style>

<script>
window.TemplateActEditors = window.TemplateActEditors || (() => {
  const editors = new Map();
  let acquisition = null;

  function looksLikeHtml(value) {
    const text = (value || '').trim().toLowerCase();
    return ['<p', '<div', '<h1', '<h2', '<h3', '<ul', '<ol', '<table', '<blockquote', '<hr', '<br', '<img', '<figure']
      .some((tag) => text.includes(tag));
  }

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value;
    return div.innerHTML;
  }

  function escapeAttribute(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function plainTextToHtml(value) {
    const normalized = (value || '').replace(/\r/g, '').trim();
    if (!normalized) {
      return '<p></p>';
    }
    const blocks = normalized.split(/\n\s*\n/).map((block) => (
      block.split('\n').map((line) => line.trim()).filter(Boolean)
    )).filter((lines) => lines.length);

    return blocks.map((lines, index) => {
      if (lines.length === 1) {
        const line = lines[0];
        if (index === 0 && line === line.toUpperCase() && line.length <= 80) {
          return `<div class="legal-doc-kicker">${escapeHtml(line)}</div>`;
        }
        if ((index === 0 || index === 1) && line.length <= 90 && !line.endsWith(':')) {
          return `<h1>${escapeHtml(line)}</h1>`;
        }
        if (line === line.toUpperCase() && line.length <= 80) {
          return `<h2>${escapeHtml(line)}</h2>`;
        }
        if (line.endsWith(':') && line.length <= 60) {
          return `<p class="legal-doc-label"><strong>${escapeHtml(line)}</strong></p>`;
        }
      }

      if (lines.every((line) => /^\d+\.\s+/.test(line))) {
        const items = lines.map((line) => line.replace(/^\d+\.\s+/, ''));
        return `<ol>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ol>`;
      }

      if (lines.every((line) => /^-\s+/.test(line))) {
        const items = lines.map((line) => line.replace(/^-\s+/, ''));
        return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
      }

      const html = lines.map((line) => escapeHtml(line)).join('<br>');
      const cssClass = lines.length > 1 ? ' class="legal-doc-party"' : '';
      return `<p${cssClass}>${html}</p>`;
    }).join('');
  }

  function ensureParagraph(surface) {
    if (!surface.innerHTML.trim()) {
      surface.innerHTML = '<p></p>';
    }
  }

  function parseJson(raw, fallback) {
    try {
      return JSON.parse(raw);
    } catch (_) {
      return fallback;
    }
  }

  function clampNumber(value, fallback, min, max, precision = 0) {
    const parsed = Number(value);
    if (!Number.isFinite(parsed)) return fallback;
    const clamped = Math.max(min, Math.min(max, parsed));
    return precision > 0 ? Number(clamped.toFixed(precision)) : Math.round(clamped);
  }

  function normalizeLayout(layout, defaults = {}) {
    const fallback = defaults && Object.keys(defaults).length ? defaults : {
      font_family: 'source_serif',
      font_size_pt: 12,
      line_height: 1.9,
      text_align: 'justify',
      margin_top_mm: 25,
      margin_right_mm: 22,
      margin_bottom_mm: 25,
      margin_left_mm: 32,
      paragraph_spacing_pt: 8,
    };
    const normalized = { ...fallback, ...(layout || {}) };
    const allowedAlign = new Set(['justify', 'left', 'center', 'right']);
    if (!allowedAlign.has(normalized.text_align)) {
      normalized.text_align = fallback.text_align;
    }
    const allowedFonts = new Set(['source_serif', 'libre_baskerville', 'spectral', 'crimson_text', 'inter', 'manrope', 'ibm_plex_mono']);
    if (!allowedFonts.has(normalized.font_family)) {
      normalized.font_family = fallback.font_family;
    }
    normalized.font_size_pt = clampNumber(normalized.font_size_pt, fallback.font_size_pt, 9, 18, 0);
    normalized.line_height = clampNumber(normalized.line_height, fallback.line_height, 1.2, 2.6, 2);
    normalized.margin_top_mm = clampNumber(normalized.margin_top_mm, fallback.margin_top_mm, 10, 45, 0);
    normalized.margin_right_mm = clampNumber(normalized.margin_right_mm, fallback.margin_right_mm, 10, 40, 0);
    normalized.margin_bottom_mm = clampNumber(normalized.margin_bottom_mm, fallback.margin_bottom_mm, 10, 45, 0);
    normalized.margin_left_mm = clampNumber(normalized.margin_left_mm, fallback.margin_left_mm, 15, 50, 0);
    normalized.paragraph_spacing_pt = clampNumber(normalized.paragraph_spacing_pt, fallback.paragraph_spacing_pt, 0, 18, 0);
    return normalized;
  }

  function getFontStack(state, fontKey) {
    const option = state.root.querySelector(`[data-layout-field="font_family"] option[value="${fontKey}"]`);
    if (option?.dataset.fontStack) {
      return option.dataset.fontStack;
    }
    return '"Source Serif 4", Georgia, serif';
  }

  function setLayoutStatus(state, message, tone = 'muted') {
    const target = state.root.querySelector('[data-editor-layout-status]');
    if (!target) return;
    target.className = `small text-${tone}`;
    target.textContent = message;
  }

  function writeLayoutInput(state) {
    if (state.layoutInput) {
      state.layoutInput.value = JSON.stringify(state.layout);
    }
  }

  function updateLayoutControls(state) {
    state.root.querySelectorAll('[data-layout-field]').forEach((control) => {
      const field = control.dataset.layoutField;
      if (!field || !(field in state.layout)) return;
      control.value = state.layout[field];
    });
  }

  function applyLayout(editorId, layout) {
    const state = editors.get(editorId);
    if (!state) return;
    state.layout = normalizeLayout(layout, state.defaultLayout);
    const fontStack = getFontStack(state, state.layout.font_family);
    state.surface.style.setProperty('--legal-font-family', fontStack);
    state.surface.style.setProperty('--legal-font-size', `${state.layout.font_size_pt}pt`);
    state.surface.style.setProperty('--legal-line-height', `${state.layout.line_height}`);
    state.surface.style.setProperty('--legal-text-align', state.layout.text_align);
    state.surface.style.setProperty('--legal-margin-top', `${state.layout.margin_top_mm}mm`);
    state.surface.style.setProperty('--legal-margin-right', `${state.layout.margin_right_mm}mm`);
    state.surface.style.setProperty('--legal-margin-bottom', `${state.layout.margin_bottom_mm}mm`);
    state.surface.style.setProperty('--legal-margin-left', `${state.layout.margin_left_mm}mm`);
    state.surface.style.setProperty('--legal-paragraph-spacing', `${state.layout.paragraph_spacing_pt}pt`);
    writeLayoutInput(state);
    updateLayoutControls(state);
  }

  function sync(editorId) {
    const state = editors.get(editorId);
    if (!state) return;
    ensureParagraph(state.surface);
    state.source.value = state.surface.innerHTML.trim();
    writeLayoutInput(state);
  }

  function syncAll() {
    editors.forEach((_, editorId) => sync(editorId));
  }

  function exec(editorId, command, value = null) {
    const state = editors.get(editorId);
    if (!state) return;
    state.surface.focus();
    document.execCommand(command, false, value);
    ensureParagraph(state.surface);
    sync(editorId);
  }

  function insertText(editorId, text) {
    const state = editors.get(editorId);
    if (!state) return;
    state.surface.focus();
    // Ripristina la posizione del cursore salvata prima del click sul chip
    if (state.savedRange) {
      const sel = window.getSelection();
      if (sel) {
        sel.removeAllRanges();
        sel.addRange(state.savedRange);
      }
      state.savedRange = null;
    }
    document.execCommand('insertText', false, text);
    sync(editorId);
  }

  function setContent(editorId, htmlOrText, append = false) {
    const state = editors.get(editorId);
    if (!state) return;
    const html = looksLikeHtml(htmlOrText) ? htmlOrText : plainTextToHtml(htmlOrText);
    if (append) {
      state.surface.innerHTML = (state.surface.innerHTML || '') + html;
    } else {
      state.surface.innerHTML = html;
    }
    ensureParagraph(state.surface);
    state.savedRange = null;
    sync(editorId);
  }

  function insertHtml(editorId, html) {
    const state = editors.get(editorId);
    if (!state) return;
    state.surface.focus();
    document.execCommand('insertHTML', false, html);
    sync(editorId);
  }

  function insertImage(editorId, dataUrl, alt = 'Documento acquisito') {
    const caption = escapeHtml(alt);
    const safeAlt = escapeAttribute(alt);
    insertHtml(
      editorId,
      `<figure><img src="${dataUrl}" alt="${safeAlt}"><figcaption>${caption}</figcaption></figure><p></p>`
    );
  }

  function getPlainText(editorId) {
    const state = editors.get(editorId);
    if (!state) return '';
    return state.surface.innerText || '';
  }

  function readLayoutControls(state) {
    const nextLayout = { ...state.layout };
    state.root.querySelectorAll('[data-layout-field]').forEach((control) => {
      const field = control.dataset.layoutField;
      if (!field) return;
      nextLayout[field] = control.value;
    });
    return normalizeLayout(nextLayout, state.defaultLayout);
  }

  async function persistLayout(state, reset = false) {
    const url = reset ? state.root.dataset.layoutResetUrl : state.root.dataset.layoutSaveUrl;
    const payload = reset ? {} : { layout: state.layout };
    setLayoutStatus(state, reset ? 'Ripristino in corso...' : 'Salvataggio in corso...', 'muted');
    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!data?.ok) {
        throw new Error(data?.errore || 'Operazione non riuscita');
      }
      editors.forEach((editorState, editorId) => {
        applyLayout(editorId, data.layout);
      });
      setLayoutStatus(state, reset ? 'Layout ripristinato.' : 'Layout salvato come predefinito.', 'success');
    } catch (error) {
      setLayoutStatus(state, error.message || 'Errore durante il salvataggio.', 'danger');
    }
  }

  function bindToolbar(root, editorId) {
    const state = editors.get(editorId);
    if (!state) return;

    root.querySelectorAll('[data-command]').forEach((button) => {
      button.addEventListener('click', () => {
        exec(editorId, button.dataset.command);
      });
    });

    const blockSelect = root.querySelector('[data-editor-block]');
    blockSelect?.addEventListener('change', () => {
      exec(editorId, 'formatBlock', blockSelect.value);
    });

    const layoutPanel = root.querySelector('[data-editor-layout-panel]');
    root.querySelector('[data-editor-toggle-layout]')?.addEventListener('click', () => {
      layoutPanel?.classList.toggle('d-none');
    });

    root.querySelectorAll('[data-layout-field]').forEach((control) => {
      const eventName = control.tagName === 'SELECT' ? 'change' : 'input';
      control.addEventListener(eventName, () => {
        applyLayout(editorId, readLayoutControls(state));
        setLayoutStatus(state, 'Anteprima layout aggiornata.', 'muted');
      });
    });

    root.querySelector('[data-editor-save-layout]')?.addEventListener('click', () => {
      state.layout = readLayoutControls(state);
      persistLayout(state, false);
    });

    root.querySelector('[data-editor-reset-layout]')?.addEventListener('click', () => {
      persistLayout(state, true);
    });

    root.querySelector('[data-editor-open-acquisition]')?.addEventListener('click', () => {
      openAcquisition(editorId);
    });
  }

  function initRoot(root) {
    const editorId = root.dataset.editorId;
    if (!editorId || editors.has(editorId)) {
      return;
    }

    const source = root.querySelector('[data-editor-source]');
    const surface = root.querySelector('[data-editor-surface]');
    const layoutInput = root.querySelector('[data-editor-layout-input]');
    if (!source || !surface) {
      return;
    }

    const defaultLayout = normalizeLayout(parseJson(root.dataset.editorDefaultLayout, {}));
    const currentLayout = normalizeLayout(parseJson(root.dataset.editorLayout, {}), defaultLayout);
    const initial = source.value || '';
    surface.dataset.placeholder = root.dataset.placeholder || '';
    surface.innerHTML = looksLikeHtml(initial) ? initial : plainTextToHtml(initial);
    ensureParagraph(surface);

    editors.set(editorId, {
      root,
      source,
      surface,
      layoutInput,
      defaultLayout,
      layout: currentLayout,
      savedRange: null,
    });

    bindToolbar(root, editorId);
    applyLayout(editorId, currentLayout);

    surface.addEventListener('input', () => sync(editorId));
    surface.addEventListener('blur', () => {
      // Salva la posizione del cursore prima che il focus lasci l'editor
      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        if (surface.contains(range.commonAncestorContainer) || surface === range.commonAncestorContainer) {
          const st = editors.get(editorId);
          if (st) st.savedRange = range.cloneRange();
        }
      }
      sync(editorId);
    });
    surface.addEventListener('paste', () => {
      setTimeout(() => sync(editorId), 0);
    });
  }

  function initAll(scope = document) {
    scope.querySelectorAll('[data-editor-root]').forEach(initRoot);
    scope.querySelectorAll('form').forEach((form) => {
      if (form.dataset.editorSyncBound === 'true') {
        return;
      }
      form.dataset.editorSyncBound = 'true';
      form.addEventListener('submit', () => syncAll());
    });
  }

  function ensureAcquisition() {
    if (acquisition) return acquisition;
    const modalEl = document.getElementById('template-act-acquisition-modal');
    acquisition = {
      modalEl,
      modal: new bootstrap.Modal(modalEl),
      feedback: modalEl.querySelector('[data-acquisition-feedback]'),
      source: modalEl.querySelector('[data-acquisition-source]'),
      webcamWrap: modalEl.querySelector('[data-acquisition-webcam-wrap]'),
      webcam: modalEl.querySelector('[data-acquisition-webcam]'),
      captureBtn: modalEl.querySelector('[data-acquisition-capture]'),
      previewWrap: modalEl.querySelector('[data-acquisition-preview-wrap]'),
      preview: modalEl.querySelector('[data-acquisition-preview]'),
      previewLabel: modalEl.querySelector('[data-acquisition-preview-label]'),
      cameraInput: modalEl.querySelector('[data-acquisition-camera-input]'),
      fileInput: modalEl.querySelector('[data-acquisition-file-input]'),
      canvas: modalEl.querySelector('[data-acquisition-canvas]'),
      currentEditorId: null,
      currentDataUrl: '',
      currentLabel: '',
      stream: null,
    };

    function setFeedback(message, tone = 'light') {
      acquisition.feedback.className = `alert alert-${tone} border small mb-3`;
      acquisition.feedback.textContent = message;
    }

    function stopWebcam() {
      if (acquisition.stream) {
        acquisition.stream.getTracks().forEach((track) => track.stop());
        acquisition.stream = null;
      }
      acquisition.webcam.srcObject = null;
    }

    function showSource() {
      stopWebcam();
      acquisition.currentDataUrl = '';
      acquisition.currentLabel = '';
      acquisition.source.classList.remove('d-none');
      acquisition.webcamWrap.classList.add('d-none');
      acquisition.previewWrap.classList.add('d-none');
      acquisition.preview.src = '';
      acquisition.previewLabel.textContent = '';
      setFeedback('Scegli il metodo di acquisizione piu comodo.', 'light');
    }

    function showPreview(dataUrl, label) {
      stopWebcam();
      acquisition.currentDataUrl = dataUrl;
      acquisition.currentLabel = label;
      acquisition.source.classList.add('d-none');
      acquisition.webcamWrap.classList.add('d-none');
      acquisition.previewWrap.classList.remove('d-none');
      acquisition.preview.src = dataUrl;
      acquisition.previewLabel.textContent = label;
      setFeedback('Anteprima pronta: puoi inserirla direttamente nel documento.', 'success');
    }

    function readImageFile(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        setFeedback('Formato non supportato: carica un file immagine.', 'warning');
        return;
      }
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const rawDataUrl = event.target?.result || '';
          const jpegDataUrl = await dataUrlToJpeg(rawDataUrl);
          showPreview(jpegDataUrl, `Acquisizione: ${file.name}`);
        } catch (_) {
          showPreview(event.target?.result || '', `Acquisizione: ${file.name}`);
        }
      };
      reader.readAsDataURL(file);
    }

    function dataUrlToJpeg(dataUrl) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = image.naturalWidth || image.width;
          canvas.height = image.naturalHeight || image.height;
          const context = canvas.getContext('2d');
          context.fillStyle = '#ffffff';
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0);
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        image.onerror = reject;
        image.src = dataUrl;
      });
    }

    async function startWebcam() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setFeedback('Webcam non disponibile in questo browser.', 'warning');
        return;
      }
      try {
        acquisition.stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 },
          },
          audio: false,
        });
        acquisition.source.classList.add('d-none');
        acquisition.previewWrap.classList.add('d-none');
        acquisition.webcamWrap.classList.remove('d-none');
        acquisition.webcam.srcObject = acquisition.stream;
        setFeedback('Inquadra il documento e scatta quando l'immagine e nitida.', 'info');
      } catch (error) {
        setFeedback(`Webcam non disponibile: ${error.message}`, 'warning');
      }
    }

    async function scanDesktop() {
      const editorState = editors.get(acquisition.currentEditorId);
      if (!editorState) return;
      setFeedback('Avvio scanner desktop in corso...', 'info');
      try {
        const response = await fetch(editorState.root.dataset.scannerUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        });
        const data = await response.json();
        if (!data?.ok || !data?.scan?.data_url) {
          throw new Error(data?.errore || 'Scanner desktop non disponibile.');
        }
        showPreview(data.scan.data_url, 'Acquisizione scanner desktop');
      } catch (error) {
        setFeedback(error.message || 'Errore scanner desktop.', 'warning');
      }
    }

    modalEl.querySelector('[data-acquisition-action="desktop-scan"]')?.addEventListener('click', scanDesktop);
    modalEl.querySelector('[data-acquisition-action="webcam"]')?.addEventListener('click', startWebcam);
    modalEl.querySelector('[data-acquisition-action="camera"]')?.addEventListener('click', () => acquisition.cameraInput.click());
    modalEl.querySelector('[data-acquisition-action="file"]')?.addEventListener('click', () => acquisition.fileInput.click());
    acquisition.captureBtn?.addEventListener('click', () => {
      const video = acquisition.webcam;
      const canvas = acquisition.canvas;
      if (!video.videoWidth || !video.videoHeight) {
        setFeedback('La webcam non e ancora pronta.', 'warning');
        return;
      }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      showPreview(canvas.toDataURL('image/jpeg', 0.92), 'Acquisizione webcam');
    });
    modalEl.querySelector('[data-acquisition-back]')?.addEventListener('click', showSource);
    modalEl.querySelector('[data-acquisition-repeat]')?.addEventListener('click', showSource);
    modalEl.querySelector('[data-acquisition-insert]')?.addEventListener('click', () => {
      if (!acquisition.currentEditorId || !acquisition.currentDataUrl) return;
      insertImage(acquisition.currentEditorId, acquisition.currentDataUrl, acquisition.currentLabel || 'Documento acquisito');
      acquisition.modal.hide();
    });
    acquisition.cameraInput?.addEventListener('change', (event) => {
      readImageFile(event.target.files?.[0]);
      event.target.value = '';
    });
    acquisition.fileInput?.addEventListener('change', (event) => {
      readImageFile(event.target.files?.[0]);
      event.target.value = '';
    });
    modalEl.addEventListener('hidden.bs.modal', () => {
      stopWebcam();
      showSource();
    });
    acquisition.showSource = showSource;
    return acquisition;
  }

  function openAcquisition(editorId) {
    const acq = ensureAcquisition();
    acq.currentEditorId = editorId;
    acq.showSource();
    acq.modal.show();
  }

  document.addEventListener('DOMContentLoaded', () => initAll());

  return {
    initAll,
    sync,
    syncAll,
    applyLayout,
    insertText,
    setContent,
    insertImage,
    getPlainText,
    openAcquisition,
  };
})();
</script>
