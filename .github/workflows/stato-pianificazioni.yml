name: Stato delle pianificazioni
# Esito dell'ultima esecuzione di ogni pianificazione dello scheduler (letture, piano del giorno, presìdi…), senza
# dati del cliente. Con «esegui» chiede l'esecuzione manuale di una o più pianificazioni, come la console.
on:
  workflow_dispatch:
    inputs:
      attiva:
        description: "Pianificazioni spente da riaccendere (identificativi separati da virgola)"
        required: false
        default: ""
      pulisci_cache_docker:
        description: "Svuota la cache di costruzione Docker inutilizzata (nessun dato, backup o immagine in uso)"
        type: boolean
        default: false
      disaccordi:
        description: "Elenco dei disaccordi del classificatore (solo identificativi e voci del catalogo)"
        type: boolean
        default: false
      sincronizza_fts_lex:
        description: "Completa l'indice di ricerca delle norme di Lex (incrementale)"
        type: boolean
        default: false
      diagnosi_memoria:
        description: "Memoria del processo delle pianificazioni: riavvii, OOM e lavori avviati (solo nomi dei lavori)"
        type: boolean
        default: false
      diagnosi_risorse:
        description: "CPU e memoria: limiti dei container, worker e thread, valori Ollama effettivi (sola lettura, nessun segreto)"
        type: boolean
        default: false
      riavvia_scheduler:
        description: "Riavvia il solo container delle pianificazioni (i lavori ripartono al giro successivo)"
        type: boolean
        default: false
      verifica_pec_fascicolo:
        description: "PEC nei documenti del fascicolo: conteggi (vuoto = no, «solo» = conta, numero = esegue anche un lotto di recupero)"
        required: false
        default: ""
      profila_ricerca:
        description: "Profila la ricerca legale (domande separate da «|», «tutte» = le quattro di LEX-01)"
        required: false
        default: ""
      precedenti_notifiche:
        description: "Precedenti di notifica dello studio: statistica aggregata (solo categorie e conteggi)"
        type: boolean
        default: false
      esegui:
        description: "Pianificazioni da avviare subito (identificativi separati da virgola, vuoto = solo lettura; PROVA_CATENA o PROVA_CATENA_1-5 = prova della catena notturna adesso; DIAGNOSI_FASCICOLO_<id> o RIACCODA_FASCICOLO_<id> = lettura di un fascicolo)"
        required: false
        default: ""
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HETZNER_HOST: ${{ vars.HETZNER_HOST || '116.203.45.57' }}
  HETZNER_USER: ${{ vars.HETZNER_USER || 'root' }}
jobs:
  stato:
    runs-on: ubuntu-latest
    # La prova della catena notturna (esegui = PROVA_CATENA) dura fino a 50 minuti più gli inventari.
    timeout-minutes: ${{ startsWith(inputs.esegui, 'PROVA_CATENA') && 75 || 40 }}
    steps:
      - uses: actions/checkout@v5
      - name: Stato e avvio delle pianificazioni
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          ESEGUI: ${{ inputs.esegui }}
          ATTIVA: ${{ inputs.attiva }}
        run: |
          set -euo pipefail
          case "$ESEGUI$ATTIVA" in *[!A-Za-z0-9_,-]*) echo "Identificativi non validi"; exit 1;; esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'shred -u ~/.ssh/id_deploy' EXIT
          case "$ESEGUI" in PROVA_CATENA*)
            # Catena notturna vera, adesso, sotto una chiave «prova-…» del registro della notte (al più 50 minuti).
            FASI="${ESEGUI#PROVA_CATENA}"; FASI="${FASI#_}"
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${HETZNER_USER}@${HETZNER_HOST}" \
              "cd /opt/iusentra/repo && docker compose --env-file /opt/iusentra/.env.hetzner -f deploy/hetzner/docker-compose.hetzner.yml exec -T -e PROVA_MINUTI=50 -e PROVA_FASI='${FASI}' scheduler-worker python -" \
              < deploy/hetzner/prova_catena.py > uscita.txt || true
            grep -m1 '^PROVA_CATENA_JSON:' uscita.txt | sed 's/^PROVA_CATENA_JSON://' | jq . > stato.json || { rm -f uscita.txt; echo "nessun esito"; exit 1; }
            rm -f uscita.txt
            jq -c '{chiave, motivo_fine, minuti, attese, errore}' stato.json
            jq -r '.passi[]? | [.fase, .lavoro, .esito, ((.secondi|tostring) + " s"), .messaggio] | @tsv' stato.json
            echo "== confronto inventario (prima, dopo)"; jq -c '.confronto' stato.json
            exit 0;;
          esac
          case "$ESEGUI" in DIAGNOSI_FASCICOLO_*|RIACCODA_FASCICOLO_*)
            # Lettura di UN fascicolo: stato dell'evento, esiti e letture in attesa; RIACCODA_ rimette in coda il fascicolo.
            F="${ESEGUI#*_FASCICOLO_}"; RIA=""; case "$ESEGUI" in RIACCODA_*) RIA="1";; esac
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${HETZNER_USER}@${HETZNER_HOST}" \
              "cd /opt/iusentra/repo && docker compose --env-file /opt/iusentra/.env.hetzner -f deploy/hetzner/docker-compose.hetzner.yml exec -T -e FASCICOLO='${F}' -e RIACCODA='${RIA}' scheduler-worker python -" \
              < deploy/hetzner/diagnosi_fascicolo.py | grep -m1 '^DIAGNOSI_FASCICOLO_JSON:' | sed 's/^DIAGNOSI_FASCICOLO_JSON://' | jq . || echo "nessun esito"
            exit 0;;
          esac
          if [ "${{ inputs.precedenti_notifiche }}" = "true" ]; then
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${HETZNER_USER}@${HETZNER_HOST}" \
              "docker exec -i iusentra-app python -" < <(cat pct/notifiche_l53_collegamento/daticert.py pct/notifiche_l53_collegamento/relata.py pct/notifiche_l53_collegamento/regola.py deploy/hetzner/precedenti_notifiche.py) 2>/dev/null \
              | grep -m1 '^PRECEDENTI_NOTIFICHE_JSON:' | sed 's/^PRECEDENTI_NOTIFICHE_JSON://' | jq . || echo "nessun esito"
            exit 0
          fi
          PR="${{ inputs.profila_ricerca }}"
          if [ -n "$PR" ]; then
            case "$PR" in *[!A-Za-z0-9\ \|.,-]*) echo "domande non valide"; exit 1;; esac
            [ "$PR" = "tutte" ] && PR="|Cassazione prescrizione|mediazione obbligatoria|usura bancaria tasso soglia|credito imposta investimenti"
            mkdir -p profilo
            IFS='|' read -ra ELENCO <<< "$PR"; n=0
            for q in "${ELENCO[@]}"; do
              n=$((n+1)); echo "== profilo domanda $n: ${q:-pagina senza ricerca}"
              ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${HETZNER_USER}@${HETZNER_HOST}" \
                "docker exec -i -e PROFILA_QUERY='${q}' -e PROFILA_LIMITE_S=240 iusentra-app python -" < deploy/hetzner/profila_ricerca.py 2>/dev/null \
                | grep -m1 '^PROFILA_RICERCA_JSON:' | sed 's/^PROFILA_RICERCA_JSON://' > "profilo/d$n.json" || true
              jq -c 'del(.dimensioni_db)' "profilo/d$n.json" || echo "nessun esito"
            done
            jq -c '.dimensioni_db' profilo/d1.json || true
            exit 0
          fi
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "${HETZNER_USER}@${HETZNER_HOST}" \
            "cd /opt/iusentra/repo && docker compose --env-file /opt/iusentra/.env.hetzner -f deploy/hetzner/docker-compose.hetzner.yml exec -T -e ESEGUI='${ESEGUI}' -e ATTIVA='${ATTIVA}' -e DISACCORDI='${{ inputs.disaccordi && '1' || '' }}' scheduler-worker python -" \
            < deploy/hetzner/stato_pianificazioni.py > uscita.txt
          grep -m1 '^STATO_PIANIFICAZIONI_JSON:' uscita.txt | sed 's/^STATO_PIANIFICAZIONI_JSON://' | jq . > stato.json
          rm -f uscita.txt
          jq -c '.accese, .avviati, .registri_letture, .notti' stato.json
          jq -c '.disaccordi[]' stato.json
          jq -r '.pianificazioni[] | [.job, (if .attiva then "attiva" else "SPENTA" end), (.ultima.esito // "mai"), (.ultima.fine // .ultima.inizio // ""), ((.ultima.durata_s // 0)|tostring) + " s", (.ultime_48h|tostring), (.ultima.errore // ""), (.ultimo_fallimento.errore // "")] | @tsv' stato.json
          # Consumo del server: carico, memoria, disco e risorse di ogni container (nessun dato del cliente).
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
            'echo "== carico"; uptime; nproc; echo "== memoria"; free -m; echo "== disco"; df -h /opt/iusentra | tail -1; echo "== container"; docker stats --no-stream --format "{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"; echo "== processi più pesanti"; ps -eo pcpu,pmem,etime,comm --sort=-pcpu | head -12'
          if [ "${{ inputs.diagnosi_memoria }}" = "true" ]; then
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
              'echo "== container delle pianificazioni"; docker inspect -f "avvio={{.State.StartedAt}} riavvii={{.RestartCount}} oom={{.State.OOMKilled}}" iusentra-scheduler-worker-1; echo "== OOM del kernel (ultime 3 ore)"; journalctl -k --since "-3h" 2>/dev/null | grep -iE "out of memory|oom-kill|Killed process" | sed -E "s/(Killed process [0-9]+ \([a-z0-9_.-]+\)).*/\1/" | tail -20; echo "== lavori avviati o conclusi (ultimi 40 minuti, solo nomi)"; docker logs --since 40m iusentra-scheduler-worker-1 2>&1 | grep -oE "(Running job|Job|job|Avvio|Esecuzione|lavoro)[^\"]{0,40}\"?[a-z_]{6,60}\"?" | sort | uniq -c | sort -rn | head -40; echo "== moduli attivi (ultimi 30 minuti, solo nomi dei logger)"; docker logs --since 30m iusentra-scheduler-worker-1 2>&1 | grep -oE "^(INFO|WARNING|ERROR):[A-Za-z0-9_.]+" | sort | uniq -c | sort -rn | head -40; echo "== messaggi dello scheduler (testo tagliato)"; docker logs --since 30m iusentra-scheduler-worker-1 2>&1 | grep -E "\[scheduler\]|piano del giorno|Recupero|recupero" | cut -c1-110 | tail -30; echo "== thread e memoria"; docker exec iusentra-scheduler-worker-1 sh -c "grep -E \"VmRSS|VmSwap|Threads\" /proc/1/status; ps -eo pid,rss,etime,args 2>/dev/null | cut -c1-80 | head"'
          fi
          if [ "${{ inputs.diagnosi_risorse }}" = "true" ]; then
            # Solo nomi di variabili in elenco chiuso: nessuna chiave, password o dato del cliente esce dal server.
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${HETZNER_USER}@${HETZNER_HOST}" \
              'echo "== host"; nproc; uptime; free -m; cat /proc/sys/vm/swappiness; cat /proc/pressure/memory 2>/dev/null; cat /proc/pressure/cpu 2>/dev/null
               echo "== limiti dei container (NanoCpus, CpusetCpus, Memory, MemoryReservation, OomScoreAdj)"
               for c in $(docker ps --format "{{.Names}}"); do docker inspect -f "$c cpus={{.HostConfig.NanoCpus}} cpuset={{.HostConfig.CpusetCpus}} mem={{.HostConfig.Memory}} riserva={{.HostConfig.MemoryReservation}} oom_adj={{.HostConfig.OomScoreAdj}} riavvii={{.RestartCount}}" "$c"; done
               echo "== variabili effettive (elenco chiuso)"
               for c in $(docker ps --format "{{.Names}}" | grep -E "app|scheduler|ocr|ollama"); do echo "-- $c"; docker exec "$c" sh -c "env | grep -E \"^(WEB_CONCURRENCY|GUNICORN_THREADS|GUNICORN_WORKER_CLASS|GUNICORN_TIMEOUT|PCT_OCR_WORKERS|OMP_THREAD_LIMIT|OLLAMA_MAX_LOADED_MODELS|OLLAMA_KEEP_ALIVE|OLLAMA_NUM_PARALLEL|OLLAMA_NUM_THREAD|OLLAMA_CONTEXT_LENGTH|OLLAMA_MAX_QUEUE|LEX_EMBED_KEEP_ALIVE|LEX_NUM_CTX|LEX_MODEL|PCT_LEX_CATALOGO_KEEP_ALIVE|PCT_SEMAFORO_MOTORI|PCT_SEQUENZA_NOTTURNA|PCT_NOTTE_INIZIO|PCT_NOTTE_FINE|IUSENTRA_OLLAMA_MEM_LIMIT)=\" | sort" 2>/dev/null; done
               echo "== processi e thread per container"; for c in $(docker ps --format "{{.Names}}" | grep -E "app|scheduler|ocr|ollama"); do echo "-- $c"; docker top "$c" -eo pid,nlwp,rss,pcpu,comm 2>/dev/null | head -12; done
               echo "== uso per container"; docker stats --no-stream --format "{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"
               echo "== OOM del kernel (24 ore)"; journalctl -k --since "-24h" 2>/dev/null | grep -oE "Killed process [0-9]+ \([a-z0-9_.-]+\)" | sort | uniq -c
               echo "== carico medio delle ultime ore (sar se presente)"; (sar -q 2>/dev/null | tail -15) || echo "sar assente"'
          fi
          if [ "${{ inputs.riavvia_scheduler }}" = "true" ]; then
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
              'echo "== riavvio del container delle pianificazioni"; docker restart -t 60 iusentra-scheduler-worker-1; sleep 20; free -m; docker stats --no-stream --format "{{.Name}}\t{{.MemUsage}}" iusentra-scheduler-worker-1'
          fi
          VPF="${{ inputs.verifica_pec_fascicolo }}"
          if [ -n "$VPF" ]; then
            case "$VPF" in solo) REC=""; LIM="0";; *[!0-9]*) echo "valore non valido"; exit 1;; *) REC="1"; LIM="$VPF";; esac
            echo "== PEC nei documenti del fascicolo"
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${HETZNER_USER}@${HETZNER_HOST}" \
              "cd /opt/iusentra/repo && docker compose --env-file /opt/iusentra/.env.hetzner -f deploy/hetzner/docker-compose.hetzner.yml exec -T -e RECUPERO='${REC}' -e LIMITE='${LIM}' -e DIAGNOSI=1 scheduler-worker python -" \
              < deploy/hetzner/verifica_pec_fascicolo.py | grep -m1 '^VERIFICA_PEC_FASCICOLO_JSON:' | sed 's/^VERIFICA_PEC_FASCICOLO_JSON://' | jq .
          fi
          if [ "${{ inputs.pulisci_cache_docker }}" = "true" ]; then
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
              'echo "== pulizia cache di costruzione Docker"; df -h /opt/iusentra | tail -1; docker builder prune -af | tail -1; df -h /opt/iusentra | tail -1'
          fi
          if [ "${{ inputs.sincronizza_fts_lex }}" = "true" ]; then
            echo "== indice FTS di Lex"
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "${HETZNER_USER}@${HETZNER_HOST}" \
              'docker exec -i iusentra-app python -' < deploy/hetzner/sincronizza_fts_lex.py
          fi
          # Occupazione del disco: cartelle dei backup e di Docker (solo dimensioni e nomi delle cartelle tecniche).
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
            'echo "== disco per cartella"; du -sh /opt/iusentra/backups /opt/iusentra/data /var/lib/docker 2>/dev/null; echo "== backup"; ls -la --time-style=+%d/%m-%H:%M /opt/iusentra/backups 2>/dev/null | head -40; du -sh /opt/iusentra/backups/* 2>/dev/null | sort -h | tail -20; echo "== docker"; docker system df'
          # Errori recenti dell'app: solo punti del codice e tipo d'errore (il messaggio, che può contenere dati, si taglia).
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${HETZNER_USER}@${HETZNER_HOST}" \
            'echo "== errori recenti (app e scheduler)"; for c in iusentra-app iusentra-scheduler-worker-1; do echo "-- $c"; docker logs --since 60m "$c" 2>&1 | grep -E "^\s+File \"/app/|^[A-Za-z0-9_.]*(Error|Exception|Timeout)[A-Za-z]*(:|$)|non disponibile" | sed -E "s/^([A-Za-z0-9_.]*(Error|Exception|Timeout)[A-Za-z]*):( database is locked| disk I\/O error)?.*/\1\3/; s/(non disponibile).*/\1/" | tail -40; done'
      - uses: actions/upload-artifact@v7
        with:
          name: stato-pianificazioni
          path: stato.json
          retention-days: 14
