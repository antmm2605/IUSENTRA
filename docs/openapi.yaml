components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: session
      description: Sessione Flask autenticata.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key tenant-aware. Non accetta chiavi globali in multi-studio.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Token CSRF richiesto per scritture da sessione browser.
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    SearchParam:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    StatusParam:
      name: status
      in: query
      schema:
        type: string
        maxLength: 40
  responses:
    BadRequest:
      description: Richiesta non valida o parametro di controllo server bloccato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Autenticazione richiesta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permesso insufficiente senza rivelare dati della risorsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Risorsa non trovata o non visibile nel tenant corrente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflitto di stato o contesto tenant mancante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validazione dominio non superata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    RateLimited:
      description: Limite richieste applicato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: File oltre limite accettato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Formato file o content-type non supportato.
      content:
        application/json:
