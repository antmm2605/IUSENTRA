<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verifica 2FA — IUSENTRA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .login-card {
      max-width: 420px;
      margin: 8vh auto 0;
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(26,58,92,.15);
    }
    .login-header {
      background: #1a3a5c;
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
    }
    .login-header .icon { font-size: 2.5rem; color: #c8972b; }
    .login-header h1 { font-size: 1.3rem; margin: .5rem 0 .1rem; }
    .login-header p { font-size: .8rem; opacity: .7; margin: 0; }
    .otp-input {
      font-size: 1.8rem;
      letter-spacing: .5rem;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="login-card card">
  <div class="login-header">
    <div class="icon"><i class="bi bi-shield-lock-fill"></i></div>
    <h1>Verifica a due fattori</h1>
    <p>{{ username }}</p>
  </div>
  <div class="card-body p-4">
    {% if errore %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ errore }}</span>
    </div>
    {% endif %}

    <p class="text-muted small mb-3">
      <i class="bi bi-phone me-1"></i>
      Inserisci il codice a 6 cifre dalla tua app di autenticazione
      (Google Authenticator, Aegis, ecc.)
    </p>

    <form method="post" autocomplete="off">
      <div class="mb-4">
        <input type="text" name="codice" class="form-control otp-input"
               inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               placeholder="000000" autofocus required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-shield-check me-2"></i>Verifica
      </button>
    </form>

    <div class="mt-3 text-center">
      <a href="{{ url_for('login') }}" class="text-muted small">
        <i class="bi bi-arrow-left me-1"></i>Torna al login
      </a>
    </div>
  </div>
</div>

</body>
</html>
