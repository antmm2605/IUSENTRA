<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accesso — Studio Legale PCT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; }
    .login-card {
      max-width: 420px;
      margin: 8vh auto 0;
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(26,58,92,.15);
    }
    .login-header {
      background: #1a3a5c;
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 2rem;
      text-align: center;
    }
    .login-header .icon { font-size: 2.5rem; color: #c8972b; }
    .login-header h1 { font-size: 1.3rem; margin: .5rem 0 .1rem; }
    .login-header p { font-size: .8rem; opacity: .7; margin: 0; }
  </style>
</head>
<body>

<div class="login-card card">
  <div class="login-header">
    <div class="icon"><i class="bi bi-briefcase-fill"></i></div>
    <h1>Studio Legale PCT</h1>
    <p>Portale di gestione professionale</p>
  </div>
  <div class="card-body p-4">
    {% if request.args.get('timeout') %}
    <div class="alert alert-warning d-flex align-items-center gap-2 py-2">
      <i class="bi bi-clock-history"></i>
      <span>Sessione scaduta per inattività. Accedi di nuovo.</span>
    </div>
    {% endif %}
    {% if errore %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ errore }}</span>
    </div>
    {% endif %}

    <form method="post" autocomplete="on">
      {% if multi_tenant %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Studio
          <span class="text-muted fw-normal small">(lascia vuoto per accesso amministratori piattaforma)</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-building"></i></span>
          <input type="text" name="studio_slug" class="form-control"
                 autocomplete="organization"
                 placeholder="slug-del-tuo-studio"
                 value="{{ request.form.get('studio_slug', '') }}">
        </div>
      </div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" required
                 autofocus autocomplete="username"
                 placeholder="nome.utente">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="pwd" class="form-control" required
                 autocomplete="current-password" placeholder="••••••••">
          <button class="btn btn-outline-secondary" type="button"
                  onclick="togglePwd()" title="Mostra/nascondi">
            <i class="bi bi-eye" id="eye-icon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
      </button>
    </form>

    <div class="mt-3 text-center text-muted small">
      <i class="bi bi-shield-lock me-1"></i>
      Accesso riservato al personale autorizzato
    </div>
  </div>
</div>

<script>
function togglePwd() {
  const p = document.getElementById('pwd');
  const i = document.getElementById('eye-icon');
  if (p.type === 'password') {
    p.type = 'text'; i.className = 'bi bi-eye-slash';
  } else {
    p.type = 'password'; i.className = 'bi bi-eye';
  }
}
</script>
</body>
</html>
