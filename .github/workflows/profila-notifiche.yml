name: Profilazione delle notifiche legali
# Tempi per fase dell'elenco dei presìdi di /notifiche-legali sul server (sola lettura) e conteggi delle ricevute
# RAC/RdAC lette dall'archivio con e senza oggetto L. 53/1994. Nessun dato dello studio.
on:
  workflow_dispatch:
    inputs:
      ricevute:
        description: "Conta anche le ricevute lette dall'archivio (1 = sì, 0 = no)"
        required: false
        default: "1"
permissions:
  contents: read
concurrency:
  group: profila-notifiche
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HETZNER_HOST: ${{ vars.HETZNER_HOST || '116.203.45.57' }}
  HETZNER_USER: ${{ vars.HETZNER_USER || 'root' }}
jobs:
  profila:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Profilazione dei presìdi
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
          RICEVUTE: ${{ inputs.ricevute }}
        run: |
          set -euo pipefail
          case "$RICEVUTE" in 0|1) ;; *) echo "Valore non valido"; exit 1;; esac
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'shred -u ~/.ssh/id_deploy' EXIT
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30"
          $SSH "${HETZNER_USER}@${HETZNER_HOST}" 'echo "== carico"; uptime; nproc; free -m; docker stats --no-stream --format "{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"'
          $SSH "${HETZNER_USER}@${HETZNER_HOST}" "docker exec -i -e PROFILA_RICEVUTE='${RICEVUTE}' iusentra-app python -" \
            < deploy/hetzner/profila_notifiche.py > uscita.txt 2>/dev/null || true
          if grep -q '^PROFILA_NOTIFICHE_JSON:' uscita.txt; then
            grep -m1 '^PROFILA_NOTIFICHE_JSON:' uscita.txt | sed 's/^PROFILA_NOTIFICHE_JSON://' | jq . > profilo.json
            jq -c '{avvio_app_s}' profilo.json
            jq -r '.code[] | "== coda \(.coda): \(.totale_s) s, righe \(.righe), fascicoli \(.fascicoli_distinti), errore \(.errore // "-")"' profilo.json
            jq -r '.code[] | .coda as $c | .fasi | to_entries[] | [$c, .key, .value.secondi, .value.chiamate] | @tsv' profilo.json
            echo "-- cProfile (coda tutte)"
            jq -r '.code[0].cprofile[] | "\(.cumulato_s)\t\(.proprio_s)\t\(.chiamate)\t\(.funzione)"' profilo.json | head -30
            echo "-- ricevute lette dall'archivio"
            jq -c '.ricevute_archivio' profilo.json
          else
            echo "Nessun esito"; tail -c 800 uscita.txt | grep -E "Error|Exception" | cut -c1-160 || true
          fi
          rm -f uscita.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: profilo-notifiche
          path: profilo.json
          if-no-files-found: ignore
          retention-days: 14
